[package]
name = "rustleaks-compcol"
version = "0.3.0-rustleaks.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Safe RAR codec subset for rustleaks"
publish = false
autobins = false
autoexamples = false

[features]
default = []
alloc = []
rar2 = ["alloc"]
rar3 = ["alloc"]
rar5 = ["alloc"]

[lib]
name = "compcol"
path = "src/lib.rs"
