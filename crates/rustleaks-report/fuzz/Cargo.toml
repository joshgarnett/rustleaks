[package]
name = "rustleaks-report-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
rustleaks-core = { path = "../../rustleaks-core" }
rustleaks-report = { path = ".." }
