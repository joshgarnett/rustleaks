[[rules]]
id = "rustleaks.bitbucket-git-credentials"
description = "bitbucket git credentials in conservative unescaped ASCII URLs"
path = '''(?:\.git/config|\.git-credentials|_history)$'''
regex = '''\b(https://[A-Za-z0-9._~-]{1,64}:[A-Za-z0-9._~-]{1,128}@bitbucket\.org/[A-Za-z0-9._~/-]{1,196}\.git)(?:[\x09-\x0d ]|$)'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.codecatalyst-git-credentials"
description = "codecatalyst git credentials in conservative unescaped ASCII URLs"
path = '''(?:\.git/config|\.git-credentials|_history)$'''
regex = '''\b(https://[A-Za-z0-9._~-]{1,64}:[A-Za-z0-9._~-]{1,128}@git\.[a-z0-9-]{1,63}\.codecatalyst\.aws/[A-Za-z0-9._~/-]{1,200})(?:[\x09\x0a\x0c\x0d ]|$)'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.codecommit-git-credentials"
description = "codecommit git credentials in conservative unescaped ASCII URLs"
path = '''(?:\.git/config|\.git-credentials|_history)$'''
regex = '''(https://[A-Za-z0-9._~-]{1,64}:[A-Za-z0-9._~-]{1,128}@git-codecommit\.[a-zA-Z0-9-]{1,63}\.amazonaws\.com/[A-Za-z0-9._~/-]{1,200})(?:[\x09\x0a\x0c\x0d ]|$)'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.mongodb-password-comma"
description = "MongoDB URI password before an unquoted comma"
regex = "\\b(mongodb(?:\\+srv)?://[A-Za-z0-9._~-]{3,50}:([A-Za-z0-9._~-]{3,88})@[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9](?::[0-9]{1,5})?),[ \\t]"
secretGroup = 2
keywords = ["mongodb://", "mongodb+srv://"]
[rules.required]
contract = "buffer-v1"
edges = [{ id = "rustleaks.mongodb-password-comma-tuple", relation = "same-candidate" }]

[[rules]]
id = "rustleaks.mongodb-password-comma-tuple"
description = "MongoDB URI tuple predicate support"
regex = "\\b(mongodb(?:\\+srv)?://[A-Za-z0-9._~-]{3,50}:([A-Za-z0-9._~-]{3,88})@[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9](?::[0-9]{1,5})?),[ \\t]"
secretGroup = 1
keywords = ["mongodb://", "mongodb+srv://"]
entropy = { algorithm = "byte-shannon-f64-v1", reject = "le", threshold = 4.0 }
skipReport = true
[[rules.allowlists]]
description = "Pinned source global secret predicates"
regexTarget = "secret"
regexes = ["(?:(?i)^true|false|null$)", "(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\\*+|\\.+)$)", "(?:^\\$(?:\\d+|{\\d+})$)", "(?:^\\$(?:[A-Z_]+|[a-z_]+)$)", "(?:^\\${(?:[A-Z_]+|[a-z_]+)}$)", "(?:^\\{\\{[ \\t]*[\\w ().|]+[ \\t]*}}$)", "(?:^\\$\\{\\{[ \\t]*(?:(?:env|github|secrets|vars)(?:\\.[A-Za-z]\\w+)+[\\w \"'&./=|]*)[ \\t]*}}$)", "(?:^%(?:[A-Z_]+|[a-z_]+)%$)", "(?:^%[+\\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)", "(?:^\\{\\d{0,2}}$)", "(?:^@(?:[A-Z_]+|[a-z_]+)@$)", "(?:^/Users/(?i)[a-z0-9]+/[\\w .-/]+$)", "(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[\\w ./-]+$)"]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]
[[rules.allowlists]]
description = "Pinned source path prefilter"
paths = ["(?:gitleaks\\.toml)", "(?:(?i)\\.(?:bmp|gif|jpe?g|png|svg|tiff?)$)", "(?:(?i)\\.(?:eot|[ot]tf|woff2?)$)", "(?:go\\.(?:mod|sum|work(?:\\.sum)?)$)", "(?:(?:^|/)vendor/modules\\.txt$)", "(?:(?:^|/)vendor/(?:github\\.com|golang\\.org/x|google\\.golang\\.org|gopkg\\.in|istio\\.io|k8s\\.io|sigs\\.k8s\\.io)(?:/.*)?$)", "(?:(?:^|/)gradlew(?:\\.bat)?$)", "(?:(?:^|/)gradle\\.lockfile$)", "(?:(?:^|/)mvnw(?:\\.cmd)?$)", "(?:(?:^|/)\\.mvn/wrapper/MavenWrapperDownloader\\.java$)", "(?:(?:^|/)node_modules(?:/.*)?$)", "(?:(?:^|/)(?:bun\\.lockb?|deno\\.lock|npm-shrinkwrap\\.json|package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock)$)", "(?:(?:^|/)bower_components(?:/.*)?$)", "(?:(?:^|/)(?:angular|bootstrap|jquery(?:-?ui)?|plotly|swagger-?ui)[a-zA-Z0-9.-]*(?:\\.min)?\\.js(?:\\.map)?$)", "(?:(?:^|/)javascript\\.json$)", "(?:(?:^|/)(?:Pipfile|poetry)\\.lock$)", "(?:(?i)(?:^|/)(?:v?env|virtualenv)/lib(?:64)?(?:/.*)?$)", "(?:(?i)(?:^|/)(?:lib(?:64)?/python[23](?:\\.\\d{1,2})+|python/[23](?:\\.\\d{1,2})+/lib(?:64)?)(?:/.*)?$)", "(?:(?i)(?:^|/)[a-z0-9_.]+-[0-9.]+\\.dist-info(?:/.+)?$)", "(?:(?:^|/)vendor/(?:bundle|ruby)(?:/.*?)?$)", "(?:\\.gem$)", "(?:verification-metadata\\.xml)", "(?:Database.refactorlog)"]
[[rules.allowlists]]
description = "Original MongoDB whole-URI example and interpolation predicates"
regexTarget = "secret"
regexes = ["(?:(?i)\\bmongodb(?:\\+srv)?:\\/\\/(?:user(?:name)?|foo):(?:pass(?:word)?|bar)(?:[^@\\/]*)?@)", "(?:(?i)\\bmongodb(?:\\+srv)?:\\/\\/[^\\s'\"\\x60]*(?:\\$\\{\\{[^}]+}}|\\$\\{[^}]+}|\\$[A-Za-z_][A-Za-z0-9_]*|{{[^}]+}}|<[^>]+>|\\[[^]]+])[^\\s'\"\\x60]*)"]

[[rules]]
id = "rustleaks.service-uri-password"
description = "Password in an ASCII service URI within the source medium-confidence domain"
regex = "\\b(?:[rR][eE][dD][iI][sS]|[rR][eE][dD][iI][sS][sS]|[aA][mM][qQ][pP]|[aA][mM][qQ][pP][sS]|[lL][dD][aA][pP]|[lL][dD][aA][pP][sS]|[sS][mM][tT][pP]|[sS][mM][tT][pP][sS]|[fF][tT][pP]|[fF][tT][pP][sS]|[sS][sS][hH])://[A-Za-z0-9._~-]{0,128}:([A-Za-z0-9._~-]{1,256})@[A-Za-z0-9][A-Za-z0-9._-]{0,252}(?::[0-9]{1,5})?(?:[/?][A-Za-z0-9._~!$&(*+,;=:@%/?-]*)?(?:[\\x09-\\x0d \\'\"\\x60#<>{}\\[\\],;)]|\\\\[nNrR]|$)"
secretGroup = 1
keywords = ["redis://", "rediss://", "amqp://", "amqps://", "ldap://", "ldaps://", "smtp://", "smtps://", "ftp://", "ftps://", "ssh://"]
[[rules.allowlists]]
description = "Pinned source global secret predicates"
regexTarget = "secret"
regexes = ["(?:(?i)^true|false|null$)", "(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\\*+|\\.+)$)", "(?:^\\$(?:\\d+|{\\d+})$)", "(?:^\\$(?:[A-Z_]+|[a-z_]+)$)", "(?:^\\${(?:[A-Z_]+|[a-z_]+)}$)", "(?:^\\{\\{[ \\t]*[\\w ().|]+[ \\t]*}}$)", "(?:^\\$\\{\\{[ \\t]*(?:(?:env|github|secrets|vars)(?:\\.[A-Za-z]\\w+)+[\\w \"'&./=|]*)[ \\t]*}}$)", "(?:^%(?:[A-Z_]+|[a-z_]+)%$)", "(?:^%[+\\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)", "(?:^\\{\\d{0,2}}$)", "(?:^@(?:[A-Z_]+|[a-z_]+)@$)", "(?:^/Users/(?i)[a-z0-9]+/[\\w .-/]+$)", "(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[\\w ./-]+$)"]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]
[[rules.allowlists]]
description = "Pinned source path prefilter"
paths = ["(?:gitleaks\\.toml)", "(?:(?i)\\.(?:bmp|gif|jpe?g|png|svg|tiff?)$)", "(?:(?i)\\.(?:eot|[ot]tf|woff2?)$)", "(?:go\\.(?:mod|sum|work(?:\\.sum)?)$)", "(?:(?:^|/)vendor/modules\\.txt$)", "(?:(?:^|/)vendor/(?:github\\.com|golang\\.org/x|google\\.golang\\.org|gopkg\\.in|istio\\.io|k8s\\.io|sigs\\.k8s\\.io)(?:/.*)?$)", "(?:(?:^|/)gradlew(?:\\.bat)?$)", "(?:(?:^|/)gradle\\.lockfile$)", "(?:(?:^|/)mvnw(?:\\.cmd)?$)", "(?:(?:^|/)\\.mvn/wrapper/MavenWrapperDownloader\\.java$)", "(?:(?:^|/)node_modules(?:/.*)?$)", "(?:(?:^|/)(?:bun\\.lockb?|deno\\.lock|npm-shrinkwrap\\.json|package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock)$)", "(?:(?:^|/)bower_components(?:/.*)?$)", "(?:(?:^|/)(?:angular|bootstrap|jquery(?:-?ui)?|plotly|swagger-?ui)[a-zA-Z0-9.-]*(?:\\.min)?\\.js(?:\\.map)?$)", "(?:(?:^|/)javascript\\.json$)", "(?:(?:^|/)(?:Pipfile|poetry)\\.lock$)", "(?:(?i)(?:^|/)(?:v?env|virtualenv)/lib(?:64)?(?:/.*)?$)", "(?:(?i)(?:^|/)(?:lib(?:64)?/python[23](?:\\.\\d{1,2})+|python/[23](?:\\.\\d{1,2})+/lib(?:64)?)(?:/.*)?$)", "(?:(?i)(?:^|/)[a-z0-9_.]+-[0-9.]+\\.dist-info(?:/.+)?$)", "(?:(?:^|/)vendor/(?:bundle|ruby)(?:/.*?)?$)", "(?:\\.gem$)", "(?:verification-metadata\\.xml)", "(?:Database.refactorlog)"]
[[rules.allowlists]]
description = "Original URI rejection: isInstructionalPlaceholder"
regexTarget = "secret"
regexes = ["(?:(?i)^(?:[a-z0-9]+[_.-])?(?:your[_.-]?(?:password|passwd|pwd)|(?:password|passwd|pwd)[_.-]goes[_.-]?here|replace[_.-]?me|insert[_.-].*[_.-]here|placeholder)$)"]
[[rules.allowlists]]
description = "Original URI rejection: isSyntheticExampleURI"
regexTarget = "match"
regexes = ["(?:(?i)^[a-z][a-z0-9+.-]*://(?:foo|user(?:name)?|example(?:[_.-]?user)?):(?:bar|pass(?:word)?|passwd|pwd|example(?:[_.-]?(?:password|passwd|pwd))?)@(?:(?:example|test)\\.(?:com|org|net)|example\\.invalid)(?::[0-9]{1,5})?(?:[/\\s'\"\\x60#]|$))"]
[[rules.allowlists]]
description = "Original URI rejection: hasIgnoredHost"
regexTarget = "match"
regexes = ["(?:(?i)^[a-z][a-z0-9+.-]*://[^@\\s]+@(?:[a-z0-9_-]+\\.)*example(?:\\.(?:com|org|net))?\\.?(?::[0-9]{1,5})?(?:,(?:[a-z0-9_-]+\\.)*example(?:\\.(?:com|org|net))?\\.?(?::[0-9]{1,5})?)*(?:[/?\\s'\"\\x60#<>{}\\[\\];)]|,?$))"]
[[rules.allowlists]]
description = "Selected medium-confidence domain excludes: isExampleValue"
regexTarget = "secret"
regexes = ["(?:(?i)^(?:(?:(?:an?|my)(?:[ _.-]|%(?:20|2d|5f))*)?example(?:(?:[ _.-]|%(?:20|2d|5f))*(?:password|passwd|pwd))?|(?:password|passwd|pwd)(?:[ _.-]|%(?:20|2d|5f))*example)(?:(?:[ _.-]|%(?:20|2d|5f))*[0-9]{1,4})?[!?.]*$)"]
[[rules.allowlists]]
description = "Selected medium-confidence domain excludes: isSyntheticCredentialTuple"
regexTarget = "match"
regexes = ["(?:(?i)^[a-z][a-z0-9+.-]*://(?:foo|test|user(?:name)?|example(?:[_.-]?user)?)[0-9]{0,4}:(?:bar|test|pass(?:word)?|passwd|pwd|token|secret)[0-9]{0,4}[!?.]?@)"]
[[rules.allowlists]]
description = "Selected medium-confidence domain excludes: isTestOrDocumentationSource"
paths = ["(?:(?i)(?:^|[/\\\\])(?:__tests__|tests?|testdata|specs?|fixtures?|mocks?|examples?|samples?|demos?|tutorials?|templates?|qa|e2e|documentation|docs?(?:[-_][a-z0-9-]+)?)(?:[/\\\\]|$))", "(?:(?i)(?:^|[/\\\\])readme(?:\\.[^/\\\\]+)?$)", "(?:(?i)(?:^|[/\\\\])[^/\\\\]*(?:[_.-](?:test|spec)|(?:test|spec)[_.-])[^/\\\\]*\\.[^/\\\\]+$)", "(?:(?i)\\.(?:example|sample|template)(?:\\.[^/\\\\]+)?$)", "(?:(?i)\\.(?:md|mdx|rst|adoc|asciidoc)$)"]
[[rules.allowlists]]
description = "Selected medium-confidence domain excludes: hasLowConfidenceHost"
regexTarget = "match"
regexes = ["(?:(?i)^[a-z][a-z0-9+.-]*://[^@\\s]+@(?:(?:[a-z0-9_-]+\\.)*example(?:\\.(?:com|org|net))?|(?:[a-z0-9_-]+\\.)*(?:invalid|test|localhost))\\.?(?::[0-9]{1,5})?(?:,(?:(?:[a-z0-9_-]+\\.)*example(?:\\.(?:com|org|net))?|(?:[a-z0-9_-]+\\.)*(?:invalid|test|localhost))\\.?(?::[0-9]{1,5})?)*(?:[/?\\s'\"\\x60#<>{}\\[\\];)]|,?$))"]
[[rules.allowlists]]
description = "Original URI mechanically non-literal password rejection"
regexTarget = "secret"
regexes = ["(?:^\\*+$)", "(?:^\\.+$)", "(?:(?i)^x{4,}$)", "(?:^•+$)", "(?:(?i)^\\[?(?:redacted|masked|filtered)\\]?$)", "(?:^\\$\\{.*}$)", "(?:^\\$\\([^\\r\\n]+\\)$)", "(?:^#\\{[^}\\r\\n]+}$)", "(?:^\\{\\{[ \\t]*.+[ \\t]*}}$)", "(?:^%\\{[^}]+}$)", "(?:^\\$[A-Za-z_][A-Za-z0-9_]*$)", "(?:(?i)^\\$env:[A-Za-z_][A-Za-z0-9_]*$)", "(?:^%[A-Za-z_][A-Za-z0-9_]*%$)", "(?:^<[^>]+>$)", "(?:^\\[[A-Za-z_][A-Za-z0-9_.-]*]$)", "(?:^\\{[^}]+}$)", "(?:(?:\\$\\{|#\\{|\\{\\{|%\\{))"]

[[rules]]
id = "rustleaks.connection-string.password.libpq-quoted"
description = "ASCII libpq keyword password (quoted)"
regex = "(?m)\\b(?:host|hostaddr)[ \\t]*=[ \\t]*[A-Za-z0-9._:/-]{1,128}(?:[ \\t]+(?:user|dbname|port|sslmode|application_name|connect_timeout)[ \\t]*=[ \\t]*[A-Za-z0-9._:/-]{1,128}){0,7}[ \\t]+password[ \\t]*=[ \\t]*'((?:[\\x20-\\x26\\x28-\\x5b\\x5d-\\x7e]|\\\\[\\x20-\\x7e]){1,128})'(?:[ \\t]|\\r?$)"
secretGroup = 1
keywords = ["password"]
[[rules.allowlists]]
description = "Conventional password placeholders"
regexTarget = "secret"
stopwords = ["${", "$(", "#{", "{{", "$env:", "redacted", "masked", "filtered", "****", "xxxx", "placeholder", "your_password", "yourpassword", "your-password", "your password", "insert_password", "replace_password", "changeme", "change_me", "change-me", "change.me", "change me", "replaceme", "replace_me", "replace-me", "replace.me", "replace me"]

[[rules]]
id = "rustleaks.connection-string.password.libpq-unquoted"
description = "ASCII libpq keyword password (unquoted)"
regex = "(?m)\\b(?:host|hostaddr)[ \\t]*=[ \\t]*[A-Za-z0-9._:/-]{1,128}(?:[ \\t]+(?:user|dbname|port|sslmode|application_name|connect_timeout)[ \\t]*=[ \\t]*[A-Za-z0-9._:/-]{1,128}){0,7}[ \\t]+password[ \\t]*=[ \\t]*((?:[\\x21\\x23-\\x26\\x28-\\x5b\\x5d-\\x7e]|\\\\[\\x20-\\x7e]){1,128})(?:[ \\t]|\\r?$)"
secretGroup = 1
keywords = ["password"]
[[rules.allowlists]]
description = "Conventional password placeholders"
regexTarget = "secret"
stopwords = ["${", "$(", "#{", "{{", "$env:", "redacted", "masked", "filtered", "****", "xxxx", "placeholder", "your_password", "yourpassword", "your-password", "your password", "insert_password", "replace_password", "changeme", "change_me", "change-me", "change.me", "change me", "replaceme", "replace_me", "replace-me", "replace.me", "replace me"]
