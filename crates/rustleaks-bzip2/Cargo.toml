[package]
name = "rustleaks-bzip2"
version = "0.1.2-rustleaks.1"
edition = "2018"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Safe BZip2 decoder maintained for the Rustleaks source layer"
publish = false

[dependencies]
tinyvec = { version = "=1.12.0", default-features = false }

[features]
default = []
nightly = ["rustc_1_40"]
rustc_1_37 = []
rustc_1_40 = ["rustc_1_37", "tinyvec/rustc_1_40"]
rustc_1_51 = []
