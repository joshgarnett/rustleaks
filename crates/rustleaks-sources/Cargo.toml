[package]
name = "rustleaks-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
archives = [
    "dep:brotli-decompressor",
    "dep:bzip2-rs",
    "dep:compcol",
    "dep:rustleaks-rar-codec",
    "dep:lz4_flex",
    "dep:lzma-rust2",
    "dep:miniz_oxide",
    "dep:rawzip",
    "dep:rustleaks-sevenz",
    "dep:sha2",
    "dep:zstd-zero",
]

[dependencies]
brotli-decompressor = { version = "=5.0.3", default-features = false, features = ["std"], optional = true }
bzip2-rs = { package = "rustleaks-bzip2", path = "../rustleaks-bzip2", version = "=0.1.2-rustleaks.1", default-features = false, optional = true }
compcol = { package = "rustleaks-compcol", path = "../rustleaks-compcol", version = "=0.3.0-rustleaks.1", default-features = false, features = ["rar2"], optional = true }
rustleaks-rar-codec = { path = "../rustleaks-rar-codec", version = "=0.9.3-rustleaks.1", optional = true }
rustleaks-core = { path = "../rustleaks-core", version = "=0.1.0-alpha.1" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["checked-decode", "frame", "safe-decode", "safe-encode", "std"], optional = true }
lzma-rust2 = { version = "=0.19.0", default-features = false, features = ["std", "xz", "lzip"], optional = true }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"], optional = true }
rawzip = { version = "=0.5.1", default-features = false, features = ["std"], optional = true }
rustleaks-sevenz = { path = "../rustleaks-sevenz", version = "=0.20.2-rustleaks.1", optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }
zstd-zero = { version = "=0.1.0", default-features = false, optional = true }

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[lints]
workspace = true
