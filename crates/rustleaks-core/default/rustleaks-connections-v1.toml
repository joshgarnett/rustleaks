[[rules]]
id = "rustleaks.mongodb-password-comma"
description = "MongoDB URI password before an unquoted comma"
regex = "\\b(mongodb(?:\\+srv)?://[A-Za-z0-9._~-]{3,50}:([A-Za-z0-9._~-]{3,88})@[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9](?::[0-9]{1,5})?),[ \\t]"
secretGroup = 2
