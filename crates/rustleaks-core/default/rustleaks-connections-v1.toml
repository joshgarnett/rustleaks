title = "Rustleaks connection rules v1"

[[rules]]
id = "rustleaks.connection-string.password.double-quoted"
description = "ASCII database connection password (double quoted)"
regex = '''(?:^|[;\x09-\x0d\x20'"=(]|\b)(?:[sS][eE][rR][vV][eE][rR]|[hH][oO][sS][tT]|[dD][aA][tT][aA][\t\x20]+[sS][oO][uU][rR][cC][eE]|[dD][sS][nN])[\t\x20]*=[\t\x20]*[\x00-\x08\x0e-\x1f\x21\x23-\x26\x28-\x3a\x3c-\x7a\x7c\x7e-\x7f][\x00-\x09\x0b-\x0c\x0e-\x21\x23-\x26\x28-\x3a\x3c-\x7a\x7c\x7e-\x7f]{0,127}[\t\x20]*;(?:[\x00-\x09\x0b-\x0c\x0e-\x21\x23-\x26\x28-\x7a\x7c\x7e-\x7f]{0,200}?;)??[\t\x20]*(?:[pP][aA][sS][sS][wW][oO][rR][dD]|[pP][wW][dD])[\t\x20]*=[\t\x20]*"([\x00-\x09\x0b-\x0c\x0e-\x21\x23-\x7f]{4,128})"[\t\x20]*(?:;|[\r\n']|$)'''
secretGroup = 1
keywords = []

[[rules.allowlists]]
description = "Source ignore-if-contains secret substrings"
regexTarget = "secret"
stopwords = [
    "${",
    "$(",
    "#{",
    "{{",
    "$env:",
    "redacted",
    "masked",
    "filtered",
    "****",
    "xxxx",
    "placeholder",
    "your_password",
    "yourpassword",
    "your-password",
    "your password",
    "insert_password",
    "replace_password",
    "changeme",
    "change_me",
    "change-me",
    "change.me",
    "change me",
    "replaceme",
    "replace_me",
    "replace-me",
    "replace.me",
    "replace me",
]

