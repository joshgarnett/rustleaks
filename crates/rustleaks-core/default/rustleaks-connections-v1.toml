[[rules]]
id = "rustleaks.connection-string.password.database-uri"
description = "ASCII database URI userinfo password"
regex = '''\b(?:[pP][oO][sS][tT][gG][rR][eE][sS](?:[qQ][lL])?|[mM][yY][sS][qQ][lL]|[mM][aA][rR][iI][aA][dD][bB])://[\x00-\x08\x0e-\x1f\x21\x23-\x26\x28-\x2e\x30-\x39\x3b-\x3f\x41-\x5f\x61-\x7f]{0,128}:([\x00-\x08\x0e-\x1f\x21\x23-\x26\x28-\x2e\x30-\x3f\x41-\x5f\x61-\x7f]{1,256})@(?:\[[0-9A-Fa-f:.%]+\]|[A-Za-z0-9][A-Za-z0-9._-]{0,252})(?::[0-9]{1,5})?(?:,(?:\[[0-9A-Fa-f:.%]+\]|[A-Za-z0-9][A-Za-z0-9._-]{0,252})(?::[0-9]{1,5})?)*(?:[/?][A-Za-z0-9._~!$&(*+,;=:@%/?-]*)?(?:[\x09-\x0d\x20\'"\x60#<>{}\[\],;)]|\\[nNrR]|$)'''
secretGroup = 1
keywords = ["postgres://", "postgresql://", "mysql://", "mariadb://"]

[[rules.allowlists]]
description = "Source global and URI secret rejection predicates"
regexTarget = "secret"
regexes = [
    '''(?:(?i)^true|false|null$)''',
    '''(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$)''',
    '''(?:^\$(?:[0-9]+|{[0-9]+})$)''',
    '''(?:^\$(?:[A-Z_]+|[a-z_]+)$)''',
    '''(?:^\${(?:[A-Z_]+|[a-z_]+)}$)''',
    '''(?:^\{\{[ \t]*[A-Za-z0-9_ ().|]+[ \t]*}}$)''',
    '''(?:^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z][A-Za-z0-9_]+)+[A-Za-z0-9_ "'&./=|]*)[ \t]*}}$)''',
    '''(?:^%(?:[A-Z_]+|[a-z_]+)%$)''',
    '''(?:^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)''',
    '''(?:^\{[0-9]{0,2}}$)''',
    '''(?:^@(?:[A-Z_]+|[a-z_]+)@$)''',
    '''(?:^/Users/(?i)[a-z0-9]+/[A-Za-z0-9_ .-/]+$)''',
    '''(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[A-Za-z0-9_ ./-]+$)''',
    '''(?:(?i)^(?:[a-z0-9]+[_.-])?(?:your[_.-]?(?:password|passwd|pwd)|(?:password|passwd|pwd)[_.-]goes[_.-]?here|replace[_.-]?me|insert[_.-].*[_.-]here|placeholder)$)''',
    '''(?:^\*+$)''',
    '''(?:^\.+$)''',
    '''(?:(?i)^x{4,}$)''',
    '''(?:^•+$)''',
    '''(?:(?i)^\[?(?:redacted|masked|filtered)\]?$)''',
    '''(?:^\$\{.*}$)''',
    '''(?:^\$\([^\r\n]+\)$)''',
    '''(?:^#\{[^}\r\n]+}$)''',
    '''(?:^\{\{[ \t]*.+[ \t]*}}$)''',
    '''(?:^%\{[^}]+}$)''',
    '''(?:^\$[A-Za-z_][A-Za-z0-9_]*$)''',
    '''(?:(?i)^\$env:[A-Za-z_][A-Za-z0-9_]*$)''',
    '''(?:^%[A-Za-z_][A-Za-z0-9_]*%$)''',
    '''(?:^<[^>]+>$)''',
    '''(?:^\[[A-Za-z_][A-Za-z0-9_.-]*]$)''',
    '''(?:^\{[^}]+}$)''',
    '''(?:(?:\$\{|#\{|\{\{|%\{))''',
]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]

[[rules.allowlists]]
description = "Source synthetic URI and ignored-host rejection predicates"
regexTarget = "match"
regexes = [
    '''(?:(?i)^[a-z][a-z0-9+.-]*://(?:foo|user(?:name)?|example(?:[_.-]?user)?):(?:bar|pass(?:word)?|passwd|pwd|example(?:[_.-]?(?:password|passwd|pwd))?)@(?:(?:example|test)\.(?:com|org|net)|example\.invalid)(?::[0-9]{1,5})?(?:[/\x09\x0a\x0c\x0d\x20'"\x60#]|$))''',
    '''(?:(?i)^[a-z][a-z0-9+.-]*://[^@\x09\x0a\x0c\x0d\x20]+@(?:[a-z0-9_-]+\.)*example(?:\.(?:com|org|net))?\.?(?::[0-9]{1,5})?(?:,(?:[a-z0-9_-]+\.)*example(?:\.(?:com|org|net))?\.?(?::[0-9]{1,5})?)*(?:[/?\x09\x0a\x0c\x0d\x20'"\x60#<>{}\[\];)]|,?$))''',
]

# Maintained additional coverage; generated by xtask generate native-pack-identity.
[[rules]]
id = "rustleaks.bitbucket-git-credentials"
description = "bitbucket git credentials in conservative unescaped ASCII URLs"
path = '''(?:\.git/config|\.git-credentials|_history)$'''
regex = '''\b(https://[A-Za-z0-9._~-]{1,64}:[A-Za-z0-9._~-]{1,128}@bitbucket\.org/[A-Za-z0-9._~/-]{1,196}\.git)(?:[\x09-\x0d ]|$)'''
secretGroup = 1
keywords = []

