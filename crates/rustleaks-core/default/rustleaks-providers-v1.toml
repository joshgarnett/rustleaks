[[rules]]
id = '''rustleaks.bitwarden-cli-client-secret'''
description = '''Bitwarden CLI personal API client secret'''
regex = '''"user_([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})_token_apiKeyClientSecret"[\t\n\f\r ]*:[\t\n\f\r ]{0,20}"([A-Za-z0-9]{10,50})"'''
path = '''[Bb][Ii\x{130}][Tt][Ww][Aa][Rr][Dd][Ee][Nn] [Cc][Ll][Ii\x{130}]/[Dd][Aa][Tt][Aa]\.[Jj][Ss][Oo][Nn]$'''
secretGroup = 2
keywords = ['''_token_apikeyclientsecret''']
entropy = { algorithm = '''byte-shannon-f64-v1''', reject = '''le''', threshold = 0.0 }

[[rules]]
id = '''rustleaks.alibaba-access-key-id-boundary'''
description = '''Alibaba Cloud AccessKey ID with a 17 to 21 byte body'''
regex = '''\b(LTAI[A-Za-z0-9]{17,21})\b'''
secretGroup = 1
keywords = ['''ltai''']
entropy = { algorithm = '''byte-shannon-f64-v1''', reject = '''lt''', threshold = 3.0 }

