[[rules]]
id = "rustleaks.clerk-secret-key-delimiter"
description = "Clerk backend secret key; test keys still authenticate the test instance"
regex = '''(?:[cC][lL][eE][rR][kK])(?:[ \tA-Za-z0-9_.-]{0,20})[\x09-\x0d '"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\x09-\x0d =]{0,5}([sS][kK]_(?:[tT][eE][sS][tT]|[lL][iI][vV][eE])_[A-Za-z0-9]{32})(?:\\['"\x60]|\x0b)'''
secretGroup = 1
keywords = ["clerk"]
entropy = { algorithm = "byte-shannon-f64-v1", reject = "lt", threshold = 3.3 }

