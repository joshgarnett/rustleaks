regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*Y2NvdW50X2lk[A-Za-z0-9_-]*InRlbXBvcmFsLmlv[A-Za-z0-9_-]*(?:ICJrZXlfaWQiOi|a2V5X2lk|rZXlfaWQi)[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})(?:\\?['"\x60]|[\x09-\x0d ;]|\\[nr]|$)'''
secretGroup = 1
keywords = ["inrlbxbvcmfslmlv"]
entropy = { algorithm = "byte-shannon-f64-v1", reject = "lt", threshold = 3.2 }

[[rules.allowlists]]
description = "Independently scoped source global secret exclusions"
regexTarget = "secret"
regexes = [
    '''(?:(?i)^true|false|null$)''',
    '''(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$)''',
    '''(?:^\$(?:\d+|{\d+})$)''',
    '''(?:^\$(?:[A-Z_]+|[a-z_]+)$)''',
    '''(?:^\${(?:[A-Z_]+|[a-z_]+)}$)''',
    '''(?:^\{\{[ \t]*[\w ().|]+[ \t]*}}$)''',
    '''(?:^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z]\w+)+[\w "'&./=|]*)[ \t]*}}$)''',
    '''(?:^%(?:[A-Z_]+|[a-z_]+)%$)''',
    '''(?:^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)''',
    '''(?:^\{\d{0,2}}$)''',
    '''(?:^@(?:[A-Z_]+|[a-z_]+)@$)''',
    '''(?:^/Users/(?i)[a-z0-9]+/[\w .-/]+$)''',
    '''(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$)''',
]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]

[[rules.allowlists]]
description = "Pinned source path prefilter"
paths = [
    '''(?:gitleaks\.toml)''',
    '''(?:(?i)\.(?:bmp|gif|jpe?g|png|svg|tiff?)$)''',
    '''(?:(?i)\.(?:eot|[ot]tf|woff2?)$)''',
    '''(?:go\.(?:mod|sum|work(?:\.sum)?)$)''',
    '''(?:(?:^|/)vendor/modules\.txt$)''',
    '''(?:(?:^|/)vendor/(?:github\.com|golang\.org/x|google\.golang\.org|gopkg\.in|istio\.io|k8s\.io|sigs\.k8s\.io)(?:/.*)?$)''',
    '''(?:(?:^|/)gradlew(?:\.bat)?$)''',
    '''(?:(?:^|/)gradle\.lockfile$)''',
    '''(?:(?:^|/)mvnw(?:\.cmd)?$)''',
    '''(?:(?:^|/)\.mvn/wrapper/MavenWrapperDownloader\.java$)''',
    '''(?:(?:^|/)node_modules(?:/.*)?$)''',
    '''(?:(?:^|/)(?:bun\.lockb?|deno\.lock|npm-shrinkwrap\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$)''',
    '''(?:(?:^|/)bower_components(?:/.*)?$)''',
    '''(?:(?:^|/)(?:angular|bootstrap|jquery(?:-?ui)?|plotly|swagger-?ui)[a-zA-Z0-9.-]*(?:\.min)?\.js(?:\.map)?$)''',
    '''(?:(?:^|/)javascript\.json$)''',
    '''(?:(?:^|/)(?:Pipfile|poetry)\.lock$)''',
    '''(?:(?i)(?:^|/)(?:v?env|virtualenv)/lib(?:64)?(?:/.*)?$)''',
    '''(?:(?i)(?:^|/)(?:lib(?:64)?/python[23](?:\.\d{1,2})+|python/[23](?:\.\d{1,2})+/lib(?:64)?)(?:/.*)?$)''',
    '''(?:(?i)(?:^|/)[a-z0-9_.]+-[0-9.]+\.dist-info(?:/.+)?$)''',
    '''(?:(?:^|/)vendor/(?:bundle|ruby)(?:/.*?)?$)''',
    '''(?:\.gem$)''',
    '''(?:verification-metadata\.xml)''',
    '''(?:Database.refactorlog)''',
]

[[rules.allowlists]]
description = "Complement of source required-character predicates over the whole captured secret"
regexTarget = "secret"
regexes = [
    '''^(?:[^0-9]*[0-9]){0,2}[^0-9]*$''',
]

