# Shared prefix delimiter increments. Ordinary delimiters remain with the base.

[[rules]]
id = "rustleaks.aws-amazon-bedrock-api-key-long-lived-delimiter"
description = "aws amazon bedrock api key long lived before an escaped quote or vertical tab"
regex = '''\b(ABSK[A-Za-z0-9+/]{109,269}={0,2})(?:\\['"\x60]|\x0b)'''
secretGroup = 1
entropy = { algorithm = "byte-shannon-f64-v1", reject = "le", threshold = 3.0 }
keywords = ["absk"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''(?:(?i)^true|false|null$)''',
  '''(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$)''',
  '''(?:^\$(?:\d+|{\d+})$)''',
  '''(?:^\$(?:[A-Z_]+|[a-z_]+)$)''',
  '''(?:^\${(?:[A-Z_]+|[a-z_]+)}$)''',
  '''(?:^\{\{[ \t]*[\w ().|]+[ \t]*}}$)''',
  '''(?:^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z]\w+)+[\w "'&./=|]*)[ \t]*}}$)''',
  '''(?:^%(?:[A-Z_]+|[a-z_]+)%$)''',
  '''(?:^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)''',
  '''(?:^\{\d{0,2}}$)''',
  '''(?:^@(?:[A-Z_]+|[a-z_]+)@$)''',
  '''(?:^/Users/(?i)[a-z0-9]+/[\w .-/]+$)''',
  '''(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$)''',
]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]

