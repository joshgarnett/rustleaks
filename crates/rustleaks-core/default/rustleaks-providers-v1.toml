[[rules]]
id = "rustleaks.circleci-project-token"
description = "CircleCI project token"
regex = '''(CCIPRJ_[A-Za-z0-9]{22}_[0-9a-f]{40})'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.deno-organization-token"
description = "Deno organization token"
regex = '''(ddo_[A-Za-z0-9]{36})'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.xai-api-key-80"
description = "xAI API key with 80-byte body"
regex = '''(xai-[A-Za-z0-9]{80})'''
secretGroup = 1
keywords = []

[[rules]]
id = "rustleaks.postman-collection-token"
description = "Postman collection access token"
regex = '''(PMAT-[A-Za-z0-9]{26})'''
secretGroup = 1
keywords = []

# Native-only structured byte entropy; only the built-in rule loader reads it.

[[rules]]
id = "rustleaks.dockerhub-personal-access-token"
description = "Docker Hub personal access token"
regex = '''\b(dckr_pat_[A-Za-z0-9_-]{27})(?:\\?['"\x60]|[\x09-\x0d ;]|\\[nr]|$)'''
secretGroup = 1
keywords = ["dckr_pat_"]
entropy = { algorithm = "byte-shannon-f64-v1", reject = "lt", threshold = 3.5 }

[[rules.allowlists]]
description = "Independently scoped source global secret exclusions"
regexTarget = "secret"
regexes = [
    '''(?:(?i)^true|false|null$)''',
    '''(?:^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$)''',
    '''(?:^\$(?:\d+|{\d+})$)''',
    '''(?:^\$(?:[A-Z_]+|[a-z_]+)$)''',
    '''(?:^\${(?:[A-Z_]+|[a-z_]+)}$)''',
    '''(?:^\{\{[ \t]*[\w ().|]+[ \t]*}}$)''',
    '''(?:^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z]\w+)+[\w "'&./=|]*)[ \t]*}}$)''',
    '''(?:^%(?:[A-Z_]+|[a-z_]+)%$)''',
    '''(?:^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$)''',
    '''(?:^\{\d{0,2}}$)''',
    '''(?:^@(?:[A-Z_]+|[a-z_]+)@$)''',
    '''(?:^/Users/(?i)[a-z0-9]+/[\w .-/]+$)''',
    '''(?:^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$)''',
]
stopwords = ["abcdefghijklmnopqrstuvwxyz", "014df517-39d1-4453-b7b3-9930c563627c"]

