[package]
name = "rustleaks-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND BSD-3-Clause"
description = "Byte-first synchronous engine for the independent Rustleaks port"
readme = "README.md"
repository.workspace = true
homepage = "https://github.com/joshgarnett/rustleaks"
documentation = "https://docs.rs/rustleaks-core"
keywords = ["gitleaks", "secret-detection", "security", "scanner"]
categories = ["development-tools"]
include = [
    "default/gitleaks.toml",
    "src/**/*.rs",
    "tests/**/*.rs",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-D", "warnings"]

[dependencies]
aho-corasick = "1"
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
semver = "1"
regex-syntax = "0.8.5"
regex-automata = { version = "0.4.12", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"

[lints]
workspace = true
