title = "Rustleaks repository self-scan"

[extend]
useDefault = true

[[allowlists]]
description = "Test corpora contain reviewed synthetic detection cases"
paths = [
  '''(^|/)testdata/(allowlist|cli|composite|config|decoder|detect|generator|git|regex|report|session|source)-corpus/''',
]

[[allowlists]]
description = "Copied fixtures intentionally contain upstream secret-shaped test data"
paths = [
  '''(^|/)testdata/fixtures/''',
]

[[allowlists]]
description = "Local Git metadata and build outputs are not repository source"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)target/''',
  '''(^|/)bazel-(bin|out|testlogs|rustleaks)/''',
]

[[allowlists]]
description = "Native rule pack test fixtures contain reviewed synthetic detection cases"
paths = [
  '''^crates/rustleaks-core/tests/support/(additional|association|format|special)_coverage\.json$''',
  '''^crates/rustleaks-core/tests/support/remaining_verified_rules\.json$''',
]

[[allowlists]]
description = "Built-in rule tests, examples and rule documentation contain reviewed synthetic credentials"
paths = [
  '''^crates/rustleaks-core/tests/(connection_rules|native_rules|native_predicates)\.rs$''',
  '''^crates/rustleaks-core/tests/support/(connection|extra_rule)_cases\.rs$''',
  '''^crates/rustleaks-core/src/native/predicate/vercel/tests\.rs$''',
  '''^crates/rustleaks-compat/src/evaluation/native_cases\.rs$''',
  '''^crates/xtask/src/package\.rs$''',
  '''^crates/rustleaks-core/default/rustleaks-connections-v1\.md$''',
  '''^docs/dev/comparison-workloads\.md$''',
]

[[allowlists]]
description = "A changelog entry quotes two synthetic ODBC passwords"
condition = "AND"
paths = [
  '''^CHANGELOG\.md$''',
]
regexes = [
  '''^(R7!q|T8!w)$''',
]

[[allowlists]]
description = "The native coverage review record and the providers pack provenance record contain Git revisions"
condition = "AND"
paths = [
  '''^crates/xtask/src/tooling/native_coverage/reviewed\.json$''',
  '''^crates/rustleaks-core/default/rustleaks-providers-v1\.provenance\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"(crate_|generated_source_|kingfisher_|openai_submodule_|source_)?revision": "[0-9a-f]{40}",?\s*$''',
]

[[allowlists]]
description = "The release license index contains SHA-256 hashes of release inputs"
condition = "AND"
paths = [
  '''^release/licenses/index\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"[A-Za-z0-9._/+-]+": "[0-9a-f]{64}",?\s*$''',
]
