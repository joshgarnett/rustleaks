name: Set up Rustleaks tools
description: Configure the native Bazel platform and install maintained tools.

inputs:
  rust-toolchain:
    description: Rust toolchain to make active.
    required: false
    default: "1.95.0"
  rust-components:
    description: Comma-separated rustup components.
    required: false
    default: clippy,rustfmt
  install-just:
    description: Install the maintained Just version.
    required: false
    default: "true"
  install-bazelisk:
    description: Install the maintained Bazelisk version.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure the native Bazel platform
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) native_platform=//platforms:linux_x86_64_gnu ;;
          Linux:ARM64) native_platform=//platforms:linux_aarch64_gnu ;;
          macOS:X64) native_platform=//platforms:macos_x86_64 ;;
          macOS:ARM64) native_platform=//platforms:macos_aarch64 ;;
          Windows:X64) native_platform=//platforms:windows_x86_64_msvc ;;
          Windows:ARM64) native_platform=//platforms:windows_aarch64_msvc ;;
          *)
            echo "unsupported GitHub runner ${RUNNER_OS}:${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        printf 'build --platforms=%s\nbuild --host_platform=%s\n' \
          "${native_platform}" "${native_platform}" > "${HOME}/.bazelrc"

    - name: Install Rust toolchain
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        RUST_COMPONENTS: ${{ inputs.rust-components }}
      run: |
        set -euo pipefail
        arguments=(toolchain install "${RUST_TOOLCHAIN}" --profile minimal)
        if [[ -n "${RUST_COMPONENTS}" ]]; then
          arguments+=(--component "${RUST_COMPONENTS}")
        fi
        rustup "${arguments[@]}"
        rustup default "${RUST_TOOLCHAIN}"
        rustc -vV
        cargo -vV

    - name: Install Just
      if: inputs.install-just == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v just >/dev/null || [[ "$(just --version)" != "just 1.53.0" ]]; then
          cargo install just --locked --version 1.53.0
        fi
        just --version

    - name: Install Bazelisk
      if: inputs.install-bazelisk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Hashes match the official v1.29.0 assets and their published .sha256 files.
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64)
            asset=bazelisk-linux-amd64
            sha256=5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
            ;;
          Linux:ARM64)
            asset=bazelisk-linux-arm64
            sha256=e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010
            ;;
          macOS:X64)
            asset=bazelisk-darwin-amd64
            sha256=16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007
            ;;
          macOS:ARM64)
            asset=bazelisk-darwin-arm64
            sha256=cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409
            ;;
          Windows:X64)
            asset=bazelisk-windows-amd64.exe
            sha256=092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b
            ;;
          Windows:ARM64)
            asset=bazelisk-windows-arm64.exe
            sha256=8bc42bd5d7857f18a21440b906469bb6c7cf91a7c72364d4b1e5ec56a76fe94f
            ;;
          *)
            echo "unsupported GitHub runner ${RUNNER_OS}:${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        bin_dir="${RUNNER_TEMP}/rustleaks-bazelisk-1.29.0"
        if [[ "${RUNNER_OS}" = Windows ]]; then bin_dir="$(cygpath -u "${bin_dir}")"; fi
        mkdir -p "${bin_dir}"
        destination="${bin_dir}/bazelisk"
        if [[ "${RUNNER_OS}" = Windows ]]; then destination="${destination}.exe"; fi
        curl --fail --show-error --silent --location --retry 3 \
          "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" \
          --output "${destination}"
        if command -v sha256sum >/dev/null; then
          actual_sha256="$(sha256sum "${destination}" | cut -d ' ' -f 1)"
        else
          actual_sha256="$(shasum -a 256 "${destination}" | cut -d ' ' -f 1)"
        fi
        test "${actual_sha256}" = "${sha256}"
        chmod +x "${destination}"
        if [[ "${RUNNER_OS}" = Windows ]]; then
          cygpath -w "${bin_dir}" >> "${GITHUB_PATH}"
        else
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"
        fi
        actual_version="$("${destination}" bazeliskVersion)"
        test "${actual_version}" = 'Bazelisk version: v1.29.0'
        printf '%s\n' "${actual_version}"
