version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Detroit
    open-pull-requests-limit: 5
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Detroit
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/Detroit
    open-pull-requests-limit: 5
