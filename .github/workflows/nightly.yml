name: Nightly

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  differential:
    name: Fresh Go differential
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Check out the pinned Go oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gitleaks/gitleaks
          ref: b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b
          path: gitleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rustleaks/.go-version
          cache-dependency-path: gitleaks/go.sum
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked Rust dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Verify the pinned oracle and replay fresh differentials
        working-directory: rustleaks
        run: |
          cargo xtask verify-upstream
          cargo xtask oracle generate --check --skip-git
          cargo xtask report-check
          cargo xtask cli-check
          just parity

  extended-fuzz:
    name: Extended AddressSanitizer fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rustleaks/.go-version
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-bazelisk: "false"
      - name: Install pinned fuzz tools
        working-directory: rustleaks
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal --component llvm-tools-preview
          cargo +nightly-2026-08-21 install cargo-fuzz --locked --version 0.13.2
      - name: Hydrate locked fuzz dependencies
        working-directory: rustleaks
        run: |
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-core/fuzz/Cargo.toml
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-sources/fuzz/Cargo.toml
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-report/fuzz/Cargo.toml
      - name: Run extended campaigns
        working-directory: rustleaks
        env:
          RUSTLEAKS_FUZZ_RUNS: "1000000"
          RUSTLEAKS_FUZZ_MAX_TOTAL_TIME: "120"
        run: just fuzz-smoke

  newest-and-scan:
    name: Newest resolution and repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rustleaks/.go-version
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Check newest allowed dependencies without committing
        working-directory: rustleaks
        run: |
          rustup toolchain install stable --profile minimal
          cargo update --workspace
          cargo +stable check --workspace --all-targets --all-features
      - name: Scan the repository and history with redacted output
        working-directory: rustleaks
        run: |
          git restore Cargo.lock
          bazelisk build //crates/rustleaks-cli:rustleaks
          bazel-bin/crates/rustleaks-cli/rustleaks dir . --redact --no-banner --timeout=300
          bazel-bin/crates/rustleaks-cli/rustleaks git . --redact --no-banner --timeout=600
