name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare non-publishing artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.0
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked package dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Build optimized local artifacts
        working-directory: rustleaks
        run: bazelisk build -c opt //:build
      - name: Exercise package consumers and no-upload publication
        working-directory: rustleaks
        run: just release-dry-run
      - name: Confirm no publication credentials are present
        run: |
          test -z "${CARGO_REGISTRY_TOKEN:-}"
          test -z "${CRATES_IO_TOKEN:-}"
