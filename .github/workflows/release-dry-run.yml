name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full main-branch commit ID to validate without publishing.
        required: true
        type: string
      version:
        description: Exact release version to validate without publishing.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.version }}-${{ inputs.candidate }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  candidate:
    name: Qualify exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the Rust toolchain
        uses: ./.github/actions/setup
        with:
          rust-components: ""
          install-just: "false"
          install-bazelisk: "false"
      - name: Require the current protected branch commit
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          TRIGGER_COMMIT: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "${TRIGGER_COMMIT}" = "${CANDIDATE}"
          test "${TRIGGER_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${CANDIDATE}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANDIDATE}"
          test -z "$(git status --short)"
          actual_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustleaks-core") | .version')"
          test "${actual_version}" = "${EXPECTED_VERSION}"
      - name: Confirm no publication credentials are present
        run: |
          test -z "${CARGO_REGISTRY_TOKEN:-}"
          test -z "${CRATES_IO_TOKEN:-}"

  package:
    name: Package, consumers, and docs.rs
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked package dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Run package consumers and no-upload publication
        working-directory: rustleaks
        run: just release-dry-run
      - name: Build docs.rs-compatible documentation and examples
        working-directory: rustleaks
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: |
          cargo doc --locked -p rustleaks-core --all-features --no-deps
          cargo test --locked -p rustleaks-core --doc
      - name: Retain the inspected package archive
        working-directory: rustleaks
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package" "${RUNNER_TEMP}/package-repeat"
          cargo package --locked -p rustleaks-core --target-dir "${RUNNER_TEMP}/package"
          cargo package --locked -p rustleaks-core --target-dir "${RUNNER_TEMP}/package-repeat"
          first="${RUNNER_TEMP}/package/package/rustleaks-core-${EXPECTED_VERSION}.crate"
          second="${RUNNER_TEMP}/package-repeat/package/rustleaks-core-${EXPECTED_VERSION}.crate"
          cmp "${first}" "${second}"
          digest="$(sha256sum "${first}" | awk '{print $1}')"
          test "${digest}" = "$(sha256sum "${second}" | awk '{print $1}')"
          printf 'candidate=%s\nversion=%s\nsha256=%s\nbyte_identical=true\n' "${CANDIDATE}" "${EXPECTED_VERSION}" "${digest}" > "${RUNNER_TEMP}/package/rustleaks-core-${EXPECTED_VERSION}.reproducibility.txt"
          cargo package --locked -p rustleaks-core --list | tee "${RUNNER_TEMP}/package/rustleaks-core-${EXPECTED_VERSION}.files.txt"
      - name: Attest the source package
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/package/package/rustleaks-core-${{ inputs.version }}.crate
      - name: Verify and retain the source package attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/package/package/rustleaks-core-${EXPECTED_VERSION}.crate"
          gh attestation verify "${archive}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-dry-run.yml" \
            --source-digest "${CANDIDATE}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          cp "${ATTESTATION_BUNDLE}" "${RUNNER_TEMP}/package/rustleaks-core-${EXPECTED_VERSION}.attestation.jsonl"
      - name: Upload the package candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustleaks-core-${{ inputs.version }}-package
          path: |
            ${{ runner.temp }}/package/package/rustleaks-core-${{ inputs.version }}.crate
            ${{ runner.temp }}/package/rustleaks-core-${{ inputs.version }}.files.txt
            ${{ runner.temp }}/package/rustleaks-core-${{ inputs.version }}.reproducibility.txt
            ${{ runner.temp }}/package/rustleaks-core-${{ inputs.version }}.attestation.jsonl
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Repository gate
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Check native notice source completeness
        working-directory: rustleaks
        run: cargo xtask release-artifact notices --check
      - name: Run the repository gate
        working-directory: rustleaks
        run: just ci

  qualification:
    name: Release checks (cargo xtask qualify)
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
          install-bazelisk: "false"
          install-nightly: "true"
      - name: Install the pinned public API tool
        working-directory: rustleaks
        run: cargo install cargo-public-api --locked --version 0.52.0
      - name: Hydrate locked dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Run cargo xtask qualify
        working-directory: rustleaks
        run: cargo xtask qualify

  security:
    name: Dependency and owned-code security
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-miri: "true"
          install-security-tools: "true"
      - name: Hydrate locked dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Run dependency, Miri, and owned-code security policy
        working-directory: rustleaks
        run: just security

  fuzz:
    name: Extended AddressSanitizer fuzz campaigns
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-fuzz: "true"
      - name: Run extended AddressSanitizer fuzz campaigns
        working-directory: rustleaks
        env:
          RUSTLEAKS_FUZZ_RUNS: "1000000"
          RUSTLEAKS_FUZZ_MAX_TOTAL_TIME: "120"
        run: just fuzz-smoke

  self-scan:
    name: Candidate and history self-scan
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          fetch-depth: 0
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Hydrate locked dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Scan the candidate worktree and complete history
        working-directory: rustleaks
        run: |
          bazelisk build //crates/rustleaks-cli:rustleaks
          bazel-bin/crates/rustleaks-cli/rustleaks dir . --redact --no-banner --timeout=300
          bazel-bin/crates/rustleaks-cli/rustleaks git . --redact --no-banner --timeout=600

  native-linux:
    name: Release artifact ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            config: release-linux-x86_64-gnu
            libc: gnu
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
            config: release-linux-aarch64-gnu
            libc: gnu
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-musl
            config: release-linux-x86_64-musl
            libc: musl
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-musl
            config: release-linux-aarch64-musl
            libc: musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Hydrate locked release dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Install the RPM package builder
        if: matrix.libc == 'gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
          rpmbuild --version
      - name: Build twice, smoke test, and prepare evidence
        id: build
        working-directory: rustleaks
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_CONFIG: ${{ matrix.config }}
          RELEASE_LIBC: ${{ matrix.libc }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
          first_root="${RUNNER_TEMP}/bazel-one"
          second_root="${RUNNER_TEMP}/bazel-two"
          work="${RUNNER_TEMP}/release-work"
          mkdir -p "${work}"
          bazelisk --output_user_root="${first_root}" build --config="${RELEASE_CONFIG}" //crates/rustleaks-cli:rustleaks
          bazelisk --output_user_root="${second_root}" build --config="${RELEASE_CONFIG}" //crates/rustleaks-cli:rustleaks
          first_bin_dir="$(bazelisk --output_user_root="${first_root}" info --config="${RELEASE_CONFIG}" bazel-bin)"
          second_bin_dir="$(bazelisk --output_user_root="${second_root}" info --config="${RELEASE_CONFIG}" bazel-bin)"
          install -m 0755 "${first_bin_dir}/crates/rustleaks-cli/rustleaks" "${work}/rustleaks-one"
          install -m 0755 "${second_bin_dir}/crates/rustleaks-cli/rustleaks" "${work}/rustleaks-two"
          "${work}/rustleaks-one" --help
          printf '%s%s\n' 'string AWSToken = "AKIA' 'LALEMEL33243OLIB";' | "${work}/rustleaks-one" stdin --redact --no-banner --exit-code=0 --report-format=json --report-path=- | tee "${work}/smoke.json"
          grep -q REDACTED "${work}/smoke.json"
          if [[ "${RELEASE_LIBC}" = gnu ]]; then
            glibc="$(readelf --version-info "${work}/rustleaks-one" | sed -n 's/.*Name: \(GLIBC_[0-9.]*\).*/\1/p' | sort -V | tail -n 1)"
            test -n "${glibc}"
          else
            if readelf --program-headers "${work}/rustleaks-one" | grep -q ' INTERP '; then
              echo "musl release artifact contains a dynamic interpreter" >&2
              exit 1
            fi
            if readelf --dynamic "${work}/rustleaks-one" 2>/dev/null | grep -q '(NEEDED)'; then
              echo "musl release artifact contains dynamic dependencies" >&2
              exit 1
            fi
            glibc=none
          fi
          cargo xtask release-artifact compare "${work}/rustleaks-one" "${work}/rustleaks-two" "${work}/reproducibility.json"
          source_args=()
          if [[ "${RELEASE_LIBC}" = gnu ]]; then
            first_cache="$(bazelisk --output_user_root="${first_root}" info --config="${RELEASE_CONFIG}" repository_cache)"
            second_cache="$(bazelisk --output_user_root="${second_root}" info --config="${RELEASE_CONFIG}" repository_cache)"
            cargo xtask release-artifact fetch-source "${first_cache}"
            cargo xtask release-artifact fetch-source "${second_cache}"
            cargo xtask release-artifact prepare-source "${first_cache}" "${CANDIDATE}" "${work}/source"
            source_archive="${work}/source/rustleaks-${EXPECTED_VERSION}-corresponding-source.tar.gz"
            cargo xtask release-artifact relink-source "${source_archive}" "${CANDIDATE}" "${RELEASE_TARGET}" "${work}/source-relink-work" "${work}/source-relink.json"
            source_args=("${work}/source-relink.json")
          fi
          cargo xtask release-artifact prepare "${work}/rustleaks-one" "${first_root}" "${RELEASE_TARGET}" "${CANDIDATE}" "${work}/reproducibility.json" "${work}/bundle" "${glibc}" "${source_args[@]}"
          cargo xtask release-artifact prepare "${work}/rustleaks-two" "${second_root}" "${RELEASE_TARGET}" "${CANDIDATE}" "${work}/reproducibility.json" "${work}/bundle-repeat" "${glibc}" "${source_args[@]}"
          stem="rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}"
          subjects="${work}/bundle/${stem}.tar.gz"
          if [[ "${RELEASE_LIBC}" = gnu ]]; then
            # Each Bazel root packages its own bundle, so the bundle
            # comparison below also proves the .deb and .rpm reproducible.
            package_input=release/linux-packages/input
            for lane in one two; do
              if [[ "${lane}" = one ]]; then
                root="${first_root}"
                bundle="${work}/bundle"
              else
                root="${second_root}"
                bundle="${work}/bundle-repeat"
              fi
              rm -rf "${package_input}"
              cargo xtask release-artifact package-input "${bundle}" "${package_input}"
              bazelisk --output_user_root="${root}" build --config="${RELEASE_CONFIG}" //release/linux-packages:deb //release/linux-packages:rpm
              exec_root="$(bazelisk --output_user_root="${root}" info --config="${RELEASE_CONFIG}" execution_root)"
              outputs="$(bazelisk --output_user_root="${root}" cquery --config="${RELEASE_CONFIG}" --output=files '//release/linux-packages:deb + //release/linux-packages:rpm')"
              test "$(grep -c '\.deb$' <<<"${outputs}")" = 1
              test "$(grep -c '\.rpm$' <<<"${outputs}")" = 1
              cargo xtask release-artifact add-packages "${bundle}" \
                "${exec_root}/$(grep '\.deb$' <<<"${outputs}")" \
                "${exec_root}/$(grep '\.rpm$' <<<"${outputs}")"
            done
            rm -rf "${package_input}"
            subjects="${subjects}"$'\n'"${work}/bundle/${stem}.deb"$'\n'"${work}/bundle/${stem}.rpm"
          fi
          {
            echo 'subjects<<SUBJECTS'
            echo "${subjects}"
            echo 'SUBJECTS'
          } >> "${GITHUB_OUTPUT}"
          cargo xtask release-artifact compare-bundles "${work}/bundle" "${work}/bundle-repeat"
          packaged="${work}/extracted/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}/rustleaks"
          packaged_smoke="${work}/packaged-smoke.json"
          mkdir -p "${work}/extracted"
          tar -xzf "${work}/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.tar.gz" -C "${work}/extracted"
          "${packaged}" --help
          printf '%s%s\n' 'string AWSToken = "AKIA' 'LALEMEL33243OLIB";' | "${packaged}" stdin --redact --no-banner --exit-code=0 --report-format=json --report-path="${packaged_smoke}"
          grep -q REDACTED "${packaged_smoke}"
      - name: Install the Linux packages on glibc 2.28
        if: matrix.libc == 'gnu'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-work/bundle"
          stem="rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}"
          binary_sha256="$(jq -r '.artifact.binarySha256' "${bundle}/manifest.json")"
          check='rustleaks --version
          test "$(sha256sum /usr/bin/rustleaks | cut -d " " -f 1)" = "${BINARY_SHA256}"
          test -f /usr/share/doc/rustleaks/LICENSE
          test -f /usr/share/doc/rustleaks/licenses/index.json
          printf "%s%s\n" "string AWSToken = \"AKIA" "LALEMEL33243OLIB\";" | rustleaks stdin --redact --no-banner --exit-code=0 --report-format=json --report-path=/tmp/smoke.json
          grep -q REDACTED /tmp/smoke.json'
          # Debian 10 and AlmaLinux 8 have glibc 2.28, the oldest supported.
          docker run --rm --network none -e BINARY_SHA256="${binary_sha256}" -v "${bundle}:/bundle:ro" \
            debian:10@sha256:58ce6f1271ae1c8a2006ff7d3e54e9874d839f573d8009c20154ad0f2fb0a225 \
            sh -euc "dpkg -i /bundle/${stem}.deb
          ${check}
          dpkg -r rustleaks
          test ! -e /usr/bin/rustleaks
          test ! -e /usr/share/doc/rustleaks"
          docker run --rm --network none -e BINARY_SHA256="${binary_sha256}" -v "${bundle}:/bundle:ro" \
            almalinux:8@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342 \
            sh -euc "rpm -i /bundle/${stem}.rpm
          ${check}
          rpm -e rustleaks
          test ! -e /usr/bin/rustleaks
          test ! -e /usr/share/doc/rustleaks"
      - name: Attest the release archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.subjects }}
      - name: Verify and retain the release archive attestation
        working-directory: rustleaks
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          SUBJECTS: ${{ steps.build.outputs.subjects }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/release-work/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.tar.gz"
          test "$(head -n 1 <<<"${SUBJECTS}")" = "${archive}"
          while IFS= read -r subject; do
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "${ATTESTATION_BUNDLE}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-dry-run.yml" \
              --source-digest "${CANDIDATE}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done <<<"${SUBJECTS}"
          cp "${ATTESTATION_BUNDLE}" "${RUNNER_TEMP}/release-work/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.attestation.jsonl"
          cargo xtask release-artifact verify "${RUNNER_TEMP}/release-work/bundle"
      - name: Upload the verified target bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustleaks-${{ inputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-work/bundle
          if-no-files-found: error
          retention-days: 7

  native-macos:
    name: Release artifact ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
            config: release-macos-x86_64
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
            config: release-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Hydrate locked release dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Build twice, smoke test, and prepare evidence
        working-directory: rustleaks
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_CONFIG: ${{ matrix.config }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
          first_root="${RUNNER_TEMP}/bazel-one"
          second_root="${RUNNER_TEMP}/bazel-two"
          work="${RUNNER_TEMP}/release-work"
          mkdir -p "${work}"
          bazelisk --output_user_root="${first_root}" build --config="${RELEASE_CONFIG}" //crates/rustleaks-cli:rustleaks
          bazelisk --output_user_root="${second_root}" build --config="${RELEASE_CONFIG}" //crates/rustleaks-cli:rustleaks
          first_bin_dir="$(bazelisk --output_user_root="${first_root}" info --config="${RELEASE_CONFIG}" bazel-bin)"
          second_bin_dir="$(bazelisk --output_user_root="${second_root}" info --config="${RELEASE_CONFIG}" bazel-bin)"
          install -m 0755 "${first_bin_dir}/crates/rustleaks-cli/rustleaks" "${work}/rustleaks-one"
          install -m 0755 "${second_bin_dir}/crates/rustleaks-cli/rustleaks" "${work}/rustleaks-two"
          test -z "$(dwarfdump --uuid "${work}/rustleaks-one")"
          "${work}/rustleaks-one" --help
          printf '%s%s\n' 'string AWSToken = "AKIA' 'LALEMEL33243OLIB";' | "${work}/rustleaks-one" stdin --redact --no-banner --exit-code=0 --report-format=json --report-path=- | tee "${work}/smoke.json"
          grep -q REDACTED "${work}/smoke.json"
          cargo xtask release-artifact compare "${work}/rustleaks-one" "${work}/rustleaks-two" "${work}/reproducibility.json"
          cargo xtask release-artifact prepare "${work}/rustleaks-one" "${first_root}" "${RELEASE_TARGET}" "${CANDIDATE}" "${work}/reproducibility.json" "${work}/bundle" none
          cargo xtask release-artifact prepare "${work}/rustleaks-two" "${second_root}" "${RELEASE_TARGET}" "${CANDIDATE}" "${work}/reproducibility.json" "${work}/bundle-repeat" none
          cargo xtask release-artifact compare-bundles "${work}/bundle" "${work}/bundle-repeat"
          packaged="${work}/extracted/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}/rustleaks"
          packaged_smoke="${work}/packaged-smoke.json"
          mkdir -p "${work}/extracted"
          tar -xzf "${work}/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.tar.gz" -C "${work}/extracted"
          "${packaged}" --help
          printf '%s%s\n' 'string AWSToken = "AKIA' 'LALEMEL33243OLIB";' | "${packaged}" stdin --redact --no-banner --exit-code=0 --report-format=json --report-path="${packaged_smoke}"
          grep -q REDACTED "${packaged_smoke}"
      - name: Attest the release archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-work/bundle/rustleaks-${{ inputs.version }}-${{ matrix.target }}.tar.gz
      - name: Verify and retain the release archive attestation
        working-directory: rustleaks
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/release-work/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.tar.gz"
          gh attestation verify "${archive}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-dry-run.yml" \
            --source-digest "${CANDIDATE}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          cp "${ATTESTATION_BUNDLE}" "${RUNNER_TEMP}/release-work/bundle/rustleaks-${EXPECTED_VERSION}-${RELEASE_TARGET}.attestation.jsonl"
          cargo xtask release-artifact verify "${RUNNER_TEMP}/release-work/bundle"
      - name: Upload the verified target bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustleaks-${{ inputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-work/bundle
          if-no-files-found: error
          retention-days: 7

  native-windows:
    name: Release artifact ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: X64
            target: x86_64-pc-windows-msvc
            config: release-windows-x86_64-msvc
          - runner: windows-11-arm
            architecture: Arm64
            target: aarch64-pc-windows-msvc
            config: release-windows-aarch64-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Hydrate locked release dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Build twice, smoke test, and prepare evidence
        shell: pwsh
        working-directory: rustleaks
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_CONFIG: ${{ matrix.config }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $env:EXPECTED_ARCHITECTURE) { throw "expected $env:EXPECTED_ARCHITECTURE runner, got $actual" }
          $firstRoot = Join-Path $env:RUNNER_TEMP bazel-one
          $secondRoot = Join-Path $env:RUNNER_TEMP bazel-two
          if ((Test-Path $firstRoot) -or (Test-Path $secondRoot)) { throw "Windows runtime qualification requires new isolated Bazel output roots" }
          $work = Join-Path $env:RUNNER_TEMP release-work
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $firstEvidence = Join-Path $work runtime-evidence/one
          $secondEvidence = Join-Path $work runtime-evidence/two
          New-Item -ItemType Directory -Force -Path $firstEvidence,$secondEvidence | Out-Null
          $firstTrace = Join-Path $firstEvidence build.log
          $secondTrace = Join-Path $secondEvidence build.log
          $runtimeFlags = @('--@rules_rust//rust/settings:experimental_per_crate_rustc_flag=crates/rustleaks-cli/src/main.rs@-Wlinker-messages', '--@rules_rust//rust/settings:experimental_per_crate_rustc_flag=crates/rustleaks-cli/src/main.rs@-Clink-arg=/VERBOSE:LIB', '--@rules_rust//rust/settings:experimental_per_crate_rustc_flag=crates/rustleaks-cli/src/main.rs@-Clink-arg=/MAP:rustleaks-runtime.map')
          $firstExecRoot = bazelisk --output_user_root=$firstRoot --windows_enable_symlinks info --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags execution_root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secondExecRoot = bazelisk --output_user_root=$secondRoot --windows_enable_symlinks info --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags execution_root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstMap = Join-Path $firstExecRoot rustleaks-runtime.map
          $secondMap = Join-Path $secondExecRoot rustleaks-runtime.map
          if ((Test-Path $firstMap) -or (Test-Path $secondMap)) { throw "Refusing stale native linker maps before the isolated builds" }
          bazelisk --output_user_root=$firstRoot --windows_enable_symlinks build --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags //crates/rustleaks-cli:rustleaks 2>&1 | Tee-Object -FilePath $firstTrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk --output_user_root=$secondRoot --windows_enable_symlinks build --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags //crates/rustleaks-cli:rustleaks 2>&1 | Tee-Object -FilePath $secondTrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstBinDir = bazelisk --output_user_root=$firstRoot --windows_enable_symlinks info --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags bazel-bin
          $secondBinDir = bazelisk --output_user_root=$secondRoot --windows_enable_symlinks info --config=$env:RELEASE_CONFIG --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all @runtimeFlags bazel-bin
          Copy-Item $firstMap (Join-Path $firstEvidence link.map)
          Copy-Item $secondMap (Join-Path $secondEvidence link.map)
          $first = Join-Path $work rustleaks-one.exe
          $second = Join-Path $work rustleaks-two.exe
          Copy-Item (Join-Path $firstBinDir crates/rustleaks-cli/rustleaks.exe) $first
          Copy-Item (Join-Path $secondBinDir crates/rustleaks-cli/rustleaks.exe) $second
          & $first --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Join-Path $work smoke.json
          $smokeOutput = ('string AWSToken = "AKIA' + 'LALEMEL33243OLIB";') | & $first stdin --redact --no-banner --exit-code=0 --report-format=json --report-path=-
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeOutput | Tee-Object $smoke
          if (-not (Select-String -Quiet -Pattern REDACTED -Path $smoke)) { throw "redacted smoke finding missing" }
          cargo xtask release-artifact compare $first $second (Join-Path $work reproducibility.json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask release-artifact prepare-windows $first $firstRoot $env:RELEASE_TARGET $env:CANDIDATE (Join-Path $work reproducibility.json) (Join-Path $work bundle) $firstMap $firstTrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask release-artifact prepare-windows $second $secondRoot $env:RELEASE_TARGET $env:CANDIDATE (Join-Path $work reproducibility.json) (Join-Path $work bundle-repeat) $secondMap $secondTrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask release-artifact compare-bundles (Join-Path $work bundle) (Join-Path $work bundle-repeat)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extract = Join-Path $work extracted
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf (Join-Path $work "bundle/rustleaks-$env:EXPECTED_VERSION-$env:RELEASE_TARGET.tar.gz") -C $extract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packaged = Join-Path $extract "rustleaks-$env:EXPECTED_VERSION-$env:RELEASE_TARGET/rustleaks.exe"
          $packagedSmoke = Join-Path $work packaged-smoke.json
          & $packaged --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ('string AWSToken = "AKIA' + 'LALEMEL33243OLIB";') | & $packaged stdin --redact --no-banner --exit-code=0 --report-format=json --report-path=$packagedSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet -Pattern REDACTED -Path $packagedSmoke)) { throw "packaged redacted smoke finding missing" }
      - name: Attest the release archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-work/bundle/rustleaks-${{ inputs.version }}-${{ matrix.target }}.tar.gz
      - name: Verify and retain the release archive attestation
        shell: pwsh
        working-directory: rustleaks
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "release-work/bundle/rustleaks-$env:EXPECTED_VERSION-$env:RELEASE_TARGET.tar.gz"
          gh attestation verify $archive --repo $env:GITHUB_REPOSITORY --bundle $env:ATTESTATION_BUNDLE --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-dry-run.yml" --source-digest $env:CANDIDATE --source-ref refs/heads/main --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $env:ATTESTATION_BUNDLE (Join-Path $env:RUNNER_TEMP "release-work/bundle/rustleaks-$env:EXPECTED_VERSION-$env:RELEASE_TARGET.attestation.jsonl")
          cargo xtask release-artifact verify (Join-Path $env:RUNNER_TEMP "release-work/bundle")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the verified target bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustleaks-${{ inputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-work/bundle
          if-no-files-found: error
          retention-days: 7
      - name: Retain Windows runtime provider evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-provider-evidence-${{ matrix.target }}-${{ inputs.candidate }}
          path: ${{ runner.temp }}/release-work/runtime-evidence
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Release candidate required
    if: always()
    needs:
      - candidate
      - package
      - acceptance
      - qualification
      - security
      - fuzz
      - self-scan
      - native-linux
      - native-macos
      - native-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every non-publishing boundary
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          PACKAGE: ${{ needs.package.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          QUALIFICATION: ${{ needs.qualification.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          SELF_SCAN: ${{ needs.self-scan.result }}
          NATIVE_LINUX: ${{ needs.native-linux.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
        run: |
          set -euo pipefail
          for result in "${CANDIDATE}" "${PACKAGE}" "${ACCEPTANCE}" "${QUALIFICATION}" "${SECURITY}" "${FUZZ}" "${SELF_SCAN}" "${NATIVE_LINUX}" "${NATIVE_MACOS}" "${NATIVE_WINDOWS}"; do
            test "${result}" = success
          done
