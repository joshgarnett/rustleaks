name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "29 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  bazel-acceptance:
    name: Bazel acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
      - name: Check native notice source completeness
        working-directory: rustleaks
        run: |
          cargo fetch --locked
          cargo xtask release-artifact notices --check
      - name: Run the acceptance gate
        working-directory: rustleaks
        run: just ci
      - name: Scan the worktree with redacted output
        working-directory: rustleaks
        run: |
          bazelisk build //crates/rustleaks-cli:rustleaks
          bazel-bin/crates/rustleaks-cli/rustleaks dir . --redact --no-banner --timeout=300
      - name: Verify Cargo and Bazel dependency drift
        working-directory: rustleaks
        run: |
          bazelisk query @crates//:srcs >/dev/null
          git diff --exit-code -- Cargo.lock cargo-bazel-lock.json MODULE.bazel.lock

  toolchains:
    name: Current stable and MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up the pinned toolchain
        uses: ./rustleaks/.github/actions/setup
        with:
          rust-components: ""
          install-just: "false"
          install-bazelisk: "false"
      - name: Install current stable
        working-directory: rustleaks
        run: rustup toolchain install stable --profile minimal
      - name: Check current stable feature profiles
        working-directory: rustleaks
        run: |
          cargo +stable check --workspace --all-targets --locked
          cargo +stable check --workspace --all-targets --all-features --locked
          cargo +stable check --workspace --all-targets --no-default-features --locked
      # The pinned toolchain in rust-toolchain.toml is the declared MSRV.
      - name: Check the declared MSRV
        working-directory: rustleaks
        run: cargo check --workspace --all-targets --all-features --locked

  security:
    name: Security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-miri: "true"
          install-security-tools: "true"
      - name: Run dependency and owned-code security policy
        working-directory: rustleaks
        run: just security

  fuzz:
    name: Fuzz build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-fuzz: "true"
      - name: Build targets and replay bounded smoke campaigns
        working-directory: rustleaks
        run: just fuzz-smoke

  package:
    name: Package and non-publishing dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked package dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Run package consumers and no-upload publish simulation
        working-directory: rustleaks
        run: just release-dry-run

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  native-unix:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            config: linux-x86_64-gnu
            platform: //platforms:linux_x86_64_gnu
            test_compilation_mode: fastbuild
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
            config: linux-aarch64-gnu
            platform: //platforms:linux_aarch64_gnu
            test_compilation_mode: fastbuild
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-musl
            config: linux-x86_64-musl
            platform: //platforms:linux_x86_64_gnu
            test_compilation_mode: fastbuild
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-musl
            config: linux-aarch64-musl
            platform: //platforms:linux_aarch64_gnu
            test_compilation_mode: fastbuild
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
            config: macos-x86_64
            platform: //platforms:macos_x86_64
            test_compilation_mode: opt
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
            config: macos-aarch64
            platform: //platforms:macos_aarch64
            test_compilation_mode: fastbuild
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Verify native host architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
      # The Python binding tests on musl run a dynamic musl CPython, which
      # needs the musl loader that the Ubuntu host lacks.
      - name: Install the musl loader
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl
          ls -l /lib/ld-musl-*.so.1
      - name: Build and test the native target
        working-directory: rustleaks
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TEST_COMPILATION_MODE: ${{ matrix.test_compilation_mode }}
        run: |
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${PLATFORM}" //:build
          if [[ "${TARGET}" == *-linux-* ]]; then
            cli="$(bazelisk cquery --config="${BAZEL_CONFIG}" --host_platform="${PLATFORM}" --output=files //crates/rustleaks-cli:rustleaks)"
            cargo xtask release-artifact check-executable "${TARGET}" "${cli}"
          fi
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${PLATFORM}" --extra_execution_platforms="${PLATFORM}" --compilation_mode="${TEST_COMPILATION_MODE}" --build_tests_only //:test
          bazelisk test --config="${BAZEL_CONFIG}" --host_platform="${PLATFORM}" --extra_execution_platforms="${PLATFORM}" --compilation_mode="${TEST_COMPILATION_MODE}" --jobs=1 //:test

  native-windows:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: X64
            target: x86_64-pc-windows-msvc
            config: windows-x86_64-msvc
            platform: //platforms:windows_x86_64_msvc
          - runner: windows-11-arm
            architecture: Arm64
            target: aarch64-pc-windows-msvc
            config: windows-aarch64-msvc
            platform: //platforms:windows_aarch64_msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Verify native host architecture
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $env:EXPECTED_ARCHITECTURE) {
            throw "expected $env:EXPECTED_ARCHITECTURE runner, got $actual"
          }
      - name: Build and test the native target
        shell: pwsh
        working-directory: rustleaks
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          bazelisk --output_user_root=C:/b --windows_enable_symlinks build --config="$env:BAZEL_CONFIG" --host_platform="$env:PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all //:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk --output_user_root=C:/b --windows_enable_symlinks build --enable_runfiles --config="$env:BAZEL_CONFIG" --host_platform="$env:PLATFORM" --extra_execution_platforms="$env:PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all --build_tests_only //:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk --output_user_root=C:/b --windows_enable_symlinks test --enable_runfiles --config="$env:BAZEL_CONFIG" --host_platform="$env:PLATFORM" --extra_execution_platforms="$env:PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all --test_env=PATH --jobs=1 //:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    name: Required
    if: always()
    needs:
      - bazel-acceptance
      - toolchains
      - security
      - fuzz
      - package
      - dependency-review
      - native-unix
      - native-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI boundary
        env:
          BAZEL_ACCEPTANCE: ${{ needs.bazel-acceptance.result }}
          TOOLCHAINS: ${{ needs.toolchains.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          PACKAGE: ${{ needs.package.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          NATIVE_UNIX: ${{ needs.native-unix.result }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for result in \
            "${BAZEL_ACCEPTANCE}" \
            "${TOOLCHAINS}" \
            "${SECURITY}" \
            "${FUZZ}" \
            "${PACKAGE}" \
            "${NATIVE_UNIX}" \
            "${NATIVE_WINDOWS}"; do
            test "${result}" = success
          done
          if [[ "${EVENT_NAME}" = pull_request ]]; then
            test "${DEPENDENCY_REVIEW}" = success
          else
            test "${DEPENDENCY_REVIEW}" = skipped
          fi
