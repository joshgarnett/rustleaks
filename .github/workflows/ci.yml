name: Native ARM64 GNU Git diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  DIAGNOSTIC_SOURCE_SHA: a138bd3d76d71e7e954dc31d554c89097bdb3445
  DIAGNOSTIC_EVIDENCE_DIR: ${{ github.workspace }}/native-diagnostic-evidence

jobs:
  git-sources-arm64-gnu:
    name: Native ARM64 GNU Git sources, 100 runs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Record workflow and runner identity
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_EVIDENCE_DIR}"
          {
            date --utc --iso-8601=seconds
            printf 'source_sha=%s\nworkflow_sha=%s\nworkflow_ref=%s\ndispatch_sha=%s\n' \
              "${DIAGNOSTIC_SOURCE_SHA}" "${GITHUB_WORKFLOW_SHA}" "${GITHUB_WORKFLOW_REF}" "${GITHUB_SHA}"
            printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\nrunner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' \
              "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
              "${RUNNER_NAME}" "${RUNNER_OS}" "${RUNNER_ARCH}"
            printf 'image_os=%s\nimage_version=%s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
            uname -a
            cat /etc/os-release
            lscpu
          } 2>&1 | tee "${DIAGNOSTIC_EVIDENCE_DIR}/runner-and-workflow.txt"
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${RUNNER_OS}:${RUNNER_ARCH}" = Linux:ARM64
          test "$(uname -m)" = aarch64

      - name: Check out the exact diagnostic source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a138bd3d76d71e7e954dc31d554c89097bdb3445
          path: rustleaks
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and clean checkout
        timeout-minutes: 2
        working-directory: rustleaks
        run: |
          set -euo pipefail
          git show --no-patch --format=fuller HEAD | tee "${DIAGNOSTIC_EVIDENCE_DIR}/source-commit.txt"
          git rev-parse HEAD HEAD^{tree} | tee "${DIAGNOSTIC_EVIDENCE_DIR}/source-identifiers.txt"
          test "$(git rev-parse HEAD)" = "${DIAGNOSTIC_SOURCE_SHA}"
          git status --porcelain=v1 --untracked-files=all | tee "${DIAGNOSTIC_EVIDENCE_DIR}/source-status-before.txt"
          test ! -s "${DIAGNOSTIC_EVIDENCE_DIR}/source-status-before.txt"
          sha256sum .bazelversion .bazelrc rust-toolchain.toml MODULE.bazel MODULE.bazel.lock \
            Cargo.lock cargo-bazel-lock.json .github/actions/setup/action.yml \
            .github/workflows/ci.yml bazel/rust_crate.bzl crates/rustleaks-sources/BUILD.bazel \
            crates/rustleaks-sources/tests/git_sources.rs \
            > "${DIAGNOSTIC_EVIDENCE_DIR}/source-inputs.sha256"

      - name: Set up maintained tools from the exact source
        timeout-minutes: 15
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"

      - name: Record maintained tool identities
        timeout-minutes: 3
        working-directory: rustleaks
        run: |
          set -euo pipefail
          {
            rustup show active-toolchain
            rustc -vV
            cargo -vV
            bazelisk bazeliskVersion
            bazelisk version
            python3 --version
            timeout --version
            cat "${HOME}/.bazelrc"
            cat rust-toolchain.toml .bazelversion
          } 2>&1 | tee "${DIAGNOSTIC_EVIDENCE_DIR}/tool-identifiers.txt"

      - name: Build only the native Git sources test
        id: build
        timeout-minutes: 25
        working-directory: rustleaks
        run: |
          set -uo pipefail
          set +e
          timeout --signal=INT --kill-after=30s 20m \
            bazelisk build --config=linux-aarch64-gnu \
            --host_platform=//platforms:linux_aarch64_gnu \
            --extra_execution_platforms=//platforms:linux_aarch64_gnu \
            --build_tests_only \
            --build_event_json_file="${DIAGNOSTIC_EVIDENCE_DIR}/build-events.jsonl" \
            //crates/rustleaks-sources:git_sources_test \
            2>&1 | tee "${DIAGNOSTIC_EVIDENCE_DIR}/build.log"
          diagnostic_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${diagnostic_status[0]}" > "${DIAGNOSTIC_EVIDENCE_DIR}/build-exit-status.txt"
          test "${diagnostic_status[1]}" -eq 0
          exit "${diagnostic_status[0]}"

      - name: Run 100 uncached whole-binary repetitions
        id: campaign
        timeout-minutes: 25
        working-directory: rustleaks
        run: |
          set -uo pipefail
          set +e
          timeout --signal=INT --kill-after=30s 20m \
            bazelisk test --config=linux-aarch64-gnu \
            --host_platform=//platforms:linux_aarch64_gnu \
            --extra_execution_platforms=//platforms:linux_aarch64_gnu \
            --jobs=1 --nozip_undeclared_test_outputs \
            --nocache_test_results --flaky_test_attempts=1 --runs_per_test=100 \
            --noruns_per_test_detects_flakes --test_keep_going \
            --build_event_json_file="${DIAGNOSTIC_EVIDENCE_DIR}/test-events.jsonl" \
            //crates/rustleaks-sources:git_sources_test \
            2>&1 | tee "${DIAGNOSTIC_EVIDENCE_DIR}/test.log"
          diagnostic_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${diagnostic_status[0]}" > "${DIAGNOSTIC_EVIDENCE_DIR}/test-exit-status.txt"
          test "${diagnostic_status[1]}" -eq 0
          exit "${diagnostic_status[0]}"

      - name: Retain all available test outputs and final source state
        if: ${{ always() }}
        timeout-minutes: 3
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_EVIDENCE_DIR}"
          printf 'build=%s\ncampaign=%s\n' "${BUILD_OUTCOME}" "${CAMPAIGN_OUTCOME}" \
            > "${DIAGNOSTIC_EVIDENCE_DIR}/step-outcomes.txt"
          if [[ -d rustleaks/bazel-testlogs/crates/rustleaks-sources/git_sources_test ]]; then
            tar -chzf "${DIAGNOSTIC_EVIDENCE_DIR}/git_sources_test.tar.gz" \
              -C rustleaks/bazel-testlogs/crates/rustleaks-sources git_sources_test
            tar -tzf "${DIAGNOSTIC_EVIDENCE_DIR}/git_sources_test.tar.gz" \
              > "${DIAGNOSTIC_EVIDENCE_DIR}/test-output-inventory.txt"
          else
            printf 'No test output directory was produced.\n' \
              > "${DIAGNOSTIC_EVIDENCE_DIR}/test-output-missing.txt"
          fi
          if [[ -d rustleaks/.git ]]; then
            git -C rustleaks status --porcelain=v1 --untracked-files=all \
              | tee "${DIAGNOSTIC_EVIDENCE_DIR}/source-status-after.txt"
            git -C rustleaks diff --binary > "${DIAGNOSTIC_EVIDENCE_DIR}/source-diff-after.patch"
            test "$(git -C rustleaks rev-parse HEAD)" = "${DIAGNOSTIC_SOURCE_SHA}"
            test ! -s "${DIAGNOSTIC_EVIDENCE_DIR}/source-status-after.txt"
          fi

      - name: Verify all 100 runs and their retained evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "${DIAGNOSTIC_EVIDENCE_DIR}/verification.log"
          import collections
          import json
          import os
          import pathlib
          import tarfile

          evidence = pathlib.Path(os.environ["DIAGNOSTIC_EVIDENCE_DIR"])
          label = "//crates/rustleaks-sources:git_sources_test"
          errors = []
          results = []
          summaries = []
          try:
              for line in (evidence / "test-events.jsonl").read_text().splitlines():
                  event = json.loads(line)
                  identity = event.get("id", {}).get("testResult", {})
                  if identity.get("label") == label:
                      results.append({"id": identity, "result": event.get("testResult", {})})
                  if event.get("id", {}).get("testSummary", {}).get("label") == label:
                      summaries.append(event.get("testSummary", {}))
          except (OSError, ValueError) as error:
              errors.append(f"Cannot read complete test events: {error}")
          if len(results) != 100:
              errors.append(f"Expected 100 result events, got {len(results)}")
          if {item["id"].get("run") for item in results} != set(range(1, 101)):
              errors.append("Run identifiers do not cover 1 through 100")
          for item in results:
              identity, result = item["id"], item["result"]
              if identity.get("attempt") != 1:
                  errors.append(f"Unexpected attempt: {identity}")
              if result.get("status") != "PASSED":
                  errors.append(f"Non-passing run: {identity}: {result.get('status')}")
              if result.get("cachedLocally") or result.get("executionInfo", {}).get("cachedRemotely"):
                  errors.append(f"Cached result: {identity}")
          if len(summaries) != 1 or summaries[0].get("totalRunCount") != 100:
              errors.append("Missing or inconsistent 100-run summary")
          elif summaries[0].get("totalNumCached", 0) != 0 or summaries[0].get("overallStatus") != "PASSED":
              errors.append("Summary is cached or not entirely passing")
          try:
              with tarfile.open(evidence / "git_sources_test.tar.gz", "r:gz") as archive:
                  names = {item.name for item in archive.getmembers() if item.isfile() or item.islnk()}
              for run in range(1, 101):
                  for filename in ("test.log", "test.xml"):
                      name = f"git_sources_test/run_{run}_of_100/{filename}"
                      if name not in names:
                          errors.append(f"Missing archived run output: {name}")
          except (OSError, tarfile.TarError) as error:
              errors.append(f"Cannot verify retained outputs: {error}")
          for phase in ("build", "test"):
              try:
                  if (evidence / f"{phase}-exit-status.txt").read_text().strip() != "0":
                      errors.append(f"{phase} exit status is nonzero")
              except OSError as error:
                  errors.append(f"Missing {phase} exit status: {error}")
          report = {
              "source_sha": os.environ["DIAGNOSTIC_SOURCE_SHA"],
              "expected_runs": 100,
              "observed_runs": len(results),
              "statuses": dict(collections.Counter(item["result"].get("status", "MISSING") for item in results)),
              "errors": errors,
              "results": results,
              "summaries": summaries,
          }
          (evidence / "verification.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({key: value for key, value in report.items() if key not in ("results", "summaries")}, indent=2))
          raise SystemExit(bool(errors))
          PY

      - name: Upload diagnostic evidence including failures
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64-gnu-git-a138bd3d-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-diagnostic-evidence/
          if-no-files-found: error
