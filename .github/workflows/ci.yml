---
name: Windows runtime input diagnostic
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'
  DIAGNOSTIC_SOURCE_SHA: c74f50f9da4a21641d1c397a3280874b52f802ca
jobs:
  native-runtime-inputs:
    name: Windows runtime inputs ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-2025
          architecture: x86_64
          target: x86_64-pc-windows-msvc
          config: release-windows-x86_64-msvc
        - runner: windows-11-arm
          architecture: aarch64
          target: aarch64-pc-windows-msvc
          config: release-windows-aarch64-msvc
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 110
    defaults:
      run:
        shell: python
    env:
      DIAGNOSTIC_EVIDENCE_SUBDIR: runtime-input-evidence
      EXPECTED_ARCHITECTURE: "${{ matrix.architecture }}"
      RELEASE_TARGET: "${{ matrix.target }}"
      RELEASE_CONFIG: "${{ matrix.config }}"
    steps:
    - name: Record runner and workflow identity
      id: identity
      timeout-minutes: 2
      run: |
        import ctypes
        import json
        import os
        import pathlib
        import platform
        import sys
        import time

        out = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['DIAGNOSTIC_EVIDENCE_SUBDIR']
        out.mkdir(parents=True, exist_ok=True)
        keys = ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
                'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_SHA',
                'RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion')
        identity = {key: os.environ.get(key, 'unavailable') for key in keys}
        identity.update(source_sha=os.environ['DIAGNOSTIC_SOURCE_SHA'],
                        target=os.environ['RELEASE_TARGET'], config=os.environ['RELEASE_CONFIG'],
                        platform=platform.platform(), python=sys.version, recorded_at=time.time())
        if os.name == 'nt':
            class SystemInfo(ctypes.Structure):
                _fields_ = [('architecture', ctypes.c_uint16), ('reserved', ctypes.c_uint16),
                            ('page_size', ctypes.c_uint32), ('minimum_address', ctypes.c_void_p),
                            ('maximum_address', ctypes.c_void_p), ('processor_mask', ctypes.c_void_p),
                            ('processors', ctypes.c_uint32), ('processor_type', ctypes.c_uint32),
                            ('allocation_granularity', ctypes.c_uint32), ('level', ctypes.c_uint16),
                            ('revision', ctypes.c_uint16)]
            info = SystemInfo()
            ctypes.windll.kernel32.GetNativeSystemInfo(ctypes.byref(info))
            architecture = {9: 'x86_64', 12: 'aarch64'}.get(info.architecture, str(info.architecture))
        else:
            architecture = os.uname().machine
            (out / 'os-release.txt').write_bytes(pathlib.Path('/etc/os-release').read_bytes())
        identity['native_architecture'] = architecture
        (out / 'runner-and-workflow.json').write_text(json.dumps(identity, indent=2) + '\n')
        print(json.dumps(identity, indent=2))
        if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch':
            raise SystemExit('Only an explicit workflow dispatch is supported')
        if architecture != os.environ['EXPECTED_ARCHITECTURE']:
            raise SystemExit(f'Unexpected native architecture: {architecture}')
    - name: Check out the exact diagnostic source
      id: checkout
      timeout-minutes: 5
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: c74f50f9da4a21641d1c397a3280874b52f802ca
        path: rustleaks
        fetch-depth: 1
        persist-credentials: false
    - name: Verify and retain the clean source identity
      id: source
      timeout-minutes: 3
      working-directory: rustleaks
      run: |
        import hashlib
        import json
        import os
        import pathlib
        import shutil
        import subprocess

        out = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['DIAGNOSTIC_EVIDENCE_SUBDIR']
        def git(name, *arguments):
            result = subprocess.run(['git', *arguments], capture_output=True, check=False)
            (out / (name + '.stdout')).write_bytes(result.stdout)
            (out / (name + '.stderr')).write_bytes(result.stderr)
            (out / (name + '.exit-status')).write_text(str(result.returncode) + '\n')
            if result.returncode:
                raise SystemExit(result.returncode)
            return result.stdout.decode().strip()
        sha = git('source-head', 'rev-parse', 'HEAD')
        git('source-tree', 'rev-parse', 'HEAD^{tree}')
        git('source-commit', 'show', '--no-patch', '--format=fuller', 'HEAD')
        status = git('source-before', 'status', '--porcelain=v1', '--untracked-files=all')
        if sha != os.environ['DIAGNOSTIC_SOURCE_SHA'] or status:
            raise SystemExit('The source must be the exact clean diagnostic commit')
        files = ['.bazelversion', '.bazelrc', 'rust-toolchain.toml', 'MODULE.bazel',
                 'MODULE.bazel.lock', 'Cargo.lock', 'cargo-bazel-lock.json',
                 '.github/actions/setup/action.yml', '.github/workflows/release-dry-run.yml',
                 'bazel/rust_crate.bzl', 'bazel/BUILD.bazel', 'crates/rustleaks-cli/BUILD.bazel']
        manifest = []
        for name in files:
            path = pathlib.Path(name)
            destination = out / 'pinned-inputs' / name
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(path, destination)
            manifest.append({'path': name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
        (out / 'pinned-inputs.json').write_text(json.dumps(manifest, indent=2) + '\n')
    - name: Set up maintained tools from the exact source
      id: setup
      timeout-minutes: 15
      uses: "./rustleaks/.github/actions/setup"
      with:
        install-just: 'false'
    - name: Build CLI once and retain native runtime evidence
      id: diagnostic
      timeout-minutes: 70
      working-directory: rustleaks
      run: |
        import csv
        import ctypes
        import hashlib
        import json
        import os
        import pathlib
        import posixpath
        import re
        import shlex
        import shutil
        import signal
        import subprocess
        import sys
        import threading
        import time

        out = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['DIAGNOSTIC_EVIDENCE_SUBDIR']
        commands = out / 'commands'
        commands.mkdir(parents=True, exist_ok=True)
        windows = os.name == 'nt'
        errors = []
        records = []
        console_lock = threading.Lock()

        def write_json(name, value):
            destination = out / name
            destination.parent.mkdir(parents=True, exist_ok=True)
            destination.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')

        def drain_stream(source, destination_path, error_event, reader_errors, label):
            try:
                with destination_path.open('wb') as destination:
                    while True:
                        chunk = source.read1(65536)
                        if not chunk:
                            break
                        offset = 0
                        while offset < len(chunk):
                            written = destination.write(chunk[offset:])
                            if written is None or written <= 0:
                                raise OSError('Native stream write made no progress')
                            offset += written
                        destination.flush()
            except Exception as error:
                reader_errors.append({'stream': label, 'error': repr(error)})
                error_event.set()
            finally:
                try:
                    source.close()
                except Exception as error:
                    reader_errors.append({'stream': label, 'close_error': repr(error)})
                    error_event.set()

        def stop_process_tree(process, prefix):
            cleanup = {'pid': process.pid}
            try:
                if windows:
                    result = subprocess.run(['taskkill.exe', '/PID', str(process.pid), '/T', '/F'],
                                            capture_output=True, timeout=10, check=False)
                    pathlib.Path(str(prefix) + '.termination.stdout').write_bytes(result.stdout)
                    pathlib.Path(str(prefix) + '.termination.stderr').write_bytes(result.stderr)
                    cleanup['taskkill_exit_status'] = result.returncode
                elif process.poll() is None:
                    os.killpg(process.pid, signal.SIGTERM)
                try:
                    process.wait(timeout=5)
                except subprocess.TimeoutExpired:
                    if windows:
                        process.kill()
                    else:
                        os.killpg(process.pid, signal.SIGKILL)
                    process.wait(timeout=5)
            except Exception as error:
                cleanup['error'] = repr(error)
            cleanup['final_process_exit_status'] = process.poll()
            return cleanup

        def run(name, argv, timeout=120, required=True, cwd=None):
            prefix = commands / name
            prefix.parent.mkdir(parents=True, exist_ok=True)
            record = {'name': name, 'argv': [str(item) for item in argv],
                      'cwd': str(cwd or pathlib.Path.cwd()), 'timeout_seconds': timeout}
            write_json('commands/' + name + '.command.json', record)
            print('COMMAND ' + json.dumps(record, ensure_ascii=True), flush=True)
            start = time.monotonic()
            process = None
            threads = []
            reader_errors = []
            reader_failed = threading.Event()
            paths = {label: pathlib.Path(str(prefix) + '.' + label + '.log') for label in ('stdout', 'stderr')}
            try:
                process = subprocess.Popen(record['argv'], cwd=cwd, stdout=subprocess.PIPE,
                                           stderr=subprocess.PIPE, start_new_session=not windows)
                threads = [threading.Thread(target=drain_stream,
                           args=(stream, paths[label], reader_failed, reader_errors, label), daemon=True)
                           for label, stream in (('stdout', process.stdout), ('stderr', process.stderr))]
                for thread in threads:
                    thread.start()
                deadline = start + timeout
                while True:
                    if reader_failed.is_set():
                        record['reader_failure'] = True
                        record['cleanup'] = stop_process_tree(process, prefix)
                        code = 125
                        break
                    code = process.poll()
                    if code is not None:
                        break
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        record['timed_out'] = True
                        record['cleanup'] = stop_process_tree(process, prefix)
                        code = 124
                        break
                    reader_failed.wait(min(0.2, remaining))
                join_deadline = time.monotonic() + 10
                for thread in threads:
                    thread.join(timeout=max(0, join_deadline - time.monotonic()))
                if any(thread.is_alive() for thread in threads):
                    record['reader_threads_still_alive'] = True
                    record['cleanup'] = stop_process_tree(process, prefix)
                    code = 125
                if reader_errors:
                    record['reader_failure'] = True
                    code = 125
            except Exception as error:
                code = 125
                record['exception'] = repr(error)
                if process is not None:
                    record['cleanup'] = stop_process_tree(process, prefix)
            record.update(exit_status=code, duration_seconds=time.monotonic() - start,
                          reader_errors=reader_errors)
            records.append(record)
            write_json('commands/' + name + '.status.json', record)
            write_json('command-statuses.json', records)
            print('STATUS ' + json.dumps({'name': name, 'exit_status': code,
                  'duration_seconds': record['duration_seconds'], 'reader_errors': reader_errors}, ensure_ascii=True), flush=True)
            if code and required:
                errors.append(f'{name} exited {code}')
            if record.get('reader_threads_still_alive'):
                raise RuntimeError('Native output draining did not stabilize; available evidence is incomplete')
            return paths['stdout'].read_text(encoding='utf-8', errors='replace') if paths['stdout'].is_file() else ''

        def file_identity(path):
            path = pathlib.Path(path)
            canonical = path.resolve(strict=True)
            digest = hashlib.sha256()
            with canonical.open('rb') as stream:
                for block in iter(lambda: stream.read(1024 * 1024), b''):
                    digest.update(block)
            return {'path': str(path), 'canonical_path': str(canonical),
                    'size': canonical.stat().st_size, 'sha256': digest.hexdigest()}


        def windows_file_version(path):
            from ctypes import wintypes
            api = ctypes.WinDLL('version', use_last_error=True)
            api.GetFileVersionInfoSizeW.argtypes = [wintypes.LPCWSTR, ctypes.POINTER(wintypes.DWORD)]
            api.GetFileVersionInfoSizeW.restype = wintypes.DWORD
            api.GetFileVersionInfoW.argtypes = [wintypes.LPCWSTR, wintypes.DWORD, wintypes.DWORD, ctypes.c_void_p]
            api.GetFileVersionInfoW.restype = wintypes.BOOL
            api.VerQueryValueW.argtypes = [ctypes.c_void_p, wintypes.LPCWSTR,
                                         ctypes.POINTER(ctypes.c_void_p), ctypes.POINTER(wintypes.UINT)]
            api.VerQueryValueW.restype = wintypes.BOOL
            handle = wintypes.DWORD()
            size = api.GetFileVersionInfoSizeW(str(path), ctypes.byref(handle))
            if not size:
                raise ctypes.WinError(ctypes.get_last_error())
            buffer = ctypes.create_string_buffer(size)
            if not api.GetFileVersionInfoW(str(path), 0, size, buffer):
                raise ctypes.WinError(ctypes.get_last_error())
            class FixedFileInfo(ctypes.Structure):
                _fields_ = [(name, wintypes.DWORD) for name in (
                    'signature', 'structure_version', 'file_version_ms', 'file_version_ls',
                    'product_version_ms', 'product_version_ls', 'flags_mask', 'flags',
                    'file_os', 'file_type', 'file_subtype', 'date_ms', 'date_ls')]
            pointer = ctypes.c_void_p()
            length = wintypes.UINT()
            if not api.VerQueryValueW(buffer, chr(92), ctypes.byref(pointer), ctypes.byref(length)):
                raise ctypes.WinError(ctypes.get_last_error())
            if length.value < ctypes.sizeof(FixedFileInfo):
                raise ValueError('Native linker fixed-version resource is truncated')
            info = ctypes.cast(pointer, ctypes.POINTER(FixedFileInfo)).contents
            if info.signature != 0xFEEF04BD:
                raise ValueError('Native linker fixed-version signature is invalid')
            def version(ms, ls):
                return '.'.join(str(value) for value in (ms >> 16, ms & 65535, ls >> 16, ls & 65535))
            return {'path': str(path), 'file_version': version(info.file_version_ms, info.file_version_ls),
                    'product_version': version(info.product_version_ms, info.product_version_ls),
                    'method': 'GetFileVersionInfoW / VerQueryValueW fixed file-version resource'}

        def msvc_library_id(value):
            name = pathlib.PureWindowsPath(value).name.lower()
            if name.endswith('.rlib'):
                return name[:-5]
            if name.endswith('.lib'):
                return name[:-4]
            return name

        def msvc_member_name(value):
            return pathlib.PureWindowsPath(value).name.lower()

        def parse_msvc_trace(text):
            result = []
            for record in linker_stdout_records(text):
                # Rustc renders the native carriage return as U+240D. Preserve raw text and
                # remove only that terminal presentation character in the parsed view.
                value = record['payload'].removesuffix('\u240d').strip()
                record['parsed_text'] = value
                if not value:
                    record['kind'] = 'empty'
                elif value in ('Searching libraries', 'Finished searching libraries'):
                    record['kind'] = 'heading'
                else:
                    match = re.fullmatch(r'Searching\s+(.+\.(?:lib|rlib)):', value, re.I)
                    loaded = re.fullmatch(r'Loaded\s+(.+\.(?:lib|rlib))\((.+)\)', value, re.I)
                    if match:
                        record.update(kind='search', library=match.group(1), library_id=msvc_library_id(match.group(1)))
                    elif loaded:
                        record.update(kind='loaded', library=loaded.group(1), library_id=msvc_library_id(loaded.group(1)),
                                      member=loaded.group(2), member_name=msvc_member_name(loaded.group(2)))
                    elif value.startswith('Found '):
                        record.update(kind='symbol', symbol=value[len('Found '):])
                    elif value.startswith('Referenced in '):
                        record.update(kind='reference', reference=value[len('Referenced in '):])
                    else:
                        record['kind'] = 'unrecognized'
                result.append(record)
            return result

        def parse_msvc_map(text):
            if 'Lib:Object' not in text:
                raise ValueError('MSVC map has no Lib:Object header')
            grouped = {}
            for number, line in enumerate(text.splitlines(), 1):
                if not re.match(r'^\s*[0-9A-Fa-f]{4}:[0-9A-Fa-f]{8,16}\s+\S+\s+[0-9A-Fa-f]{8,16}\b', line):
                    continue
                origin = line.split()[-1]
                if ':' not in origin:
                    continue
                library, member = origin.rsplit(':', 1)
                key = (msvc_library_id(library), member)
                if key not in grouped:
                    suffix = pathlib.PureWindowsPath(member).suffix.lower()
                    grouped[key] = {'library': library, 'library_id': key[0], 'member': member,
                                    'member_name': msvc_member_name(member),
                                    'member_kind': 'object' if suffix in ('.obj', '.o') else 'import-member' if suffix == '.dll' else 'other',
                                    'first_map_line': number, 'first_raw_map_line': line, 'symbol_count': 0}
                grouped[key]['symbol_count'] += 1
            if not grouped:
                raise ValueError('No library/object map rows were parsed')
            return list(grouped.values())

        def legal_comment_ranges(raw):
            # Return exact original-byte ranges only from initial comment blocks.
            result = []
            offset = 3 if raw.startswith(b'\xef\xbb\xbf') else 0
            while offset < len(raw):
                while offset < len(raw) and raw[offset:offset + 1] in b' \t\r\n':
                    offset += 1
                start = offset
                if raw.startswith(b'/*', offset):
                    end = raw.find(b'*/', offset + 2)
                    if end < 0:
                        break
                    offset = end + 2
                elif raw.startswith(b'//', offset) or raw.startswith(b';', offset):
                    # Preserve a contiguous run of line comments as one legal header.
                    marker = b'//' if raw.startswith(b'//', offset) else b';'
                    while True:
                        end = raw.find(b'\n', offset)
                        offset = len(raw) if end < 0 else end + 1
                        lookahead = offset
                        while lookahead < len(raw) and raw[lookahead:lookahead + 1] in b' \t':
                            lookahead += 1
                        if raw.startswith(marker, lookahead):
                            offset = lookahead
                        else:
                            break
                else:
                    break
                block = raw[start:offset]
                if re.search(br'copyright|licen[cs]e|permission|rights reserved|redistribut|terms', block, re.I):
                    result.append((start, offset))
            return result

        notices = []
        notice_requests = []
        def notice(path, origin, required=False):
            path = pathlib.Path(path)
            request = {'path': str(path), 'origin': origin, 'required': required}
            notice_requests.append(request)
            if not path.is_file():
                request['status'] = 'missing'
                write_json('notice-requests.json', notice_requests)
                if required:
                    errors.append(f'Required public notice is missing: {path}')
                return
            identity = file_identity(path)
            if identity['size'] > 25 * 1024 * 1024:
                request['status'] = 'exceeds-size-bound'
                write_json('notice-requests.json', notice_requests)
                errors.append(f'Public notice exceeds the evidence bound: {path}')
                return
            destination = out / 'public-notices' / (identity['sha256'][:16] + '-' + path.name)
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(path, destination)
            identity.update(origin=origin, required=required, retained_path=str(destination.relative_to(out)))
            notices.append(identity)
            request.update(status='retained', retained_path=identity['retained_path'], sha256=identity['sha256'])
            write_json('public-notices.json', notices)
            write_json('notice-requests.json', notice_requests)

        def normalize_codegen(arguments):
            result = []
            index = 0
            while index < len(arguments):
                argument = arguments[index]
                value = None
                if argument in ('-C', '--codegen'):
                    index += 1
                    if index >= len(arguments):
                        raise ValueError('Missing value after ' + argument)
                    value = arguments[index]
                elif argument.startswith('--codegen='):
                    value = argument[len('--codegen='):]
                elif argument.startswith('-C'):
                    value = argument[2:].removeprefix('=')
                if value is not None:
                    key, separator, setting = value.partition('=')
                    if not separator or not key or not setting:
                        raise ValueError('Malformed codegen option: ' + value)
                    result.append((key, setting))
                index += 1
            return result

        def selected_linker(codegen):
            values = {value for key, value in codegen if key == 'linker'}
            if len(values) != 1:
                raise ValueError('Actual linker path is missing or ambiguous in the Rustc action')
            return next(iter(values))


        def parse_printed_linker_command(raw_line):
            if '\x00' in raw_line:
                raise ValueError('NUL in printed linker command')
            tokens = shlex.split(raw_line, posix=True)
            assignments = []
            index = 0
            while index < len(tokens) and re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*=.*', tokens[index], re.S):
                assignments.append(tokens[index])
                index += 1
            argv = tokens[index:]
            if not argv or len(argv) == 1 or argv[0].startswith('-'):
                raise ValueError('Printed command has no executable and argument sequence')
            return {'raw_line': raw_line, 'environment_assignments': assignments, 'argv': argv}

        def validate_printed_linker_program(program, selected_program, execution_root):
            actual = posixpath.normpath(posixpath.join(str(execution_root), program))
            expected = posixpath.normpath(str(selected_program))
            if actual != expected:
                raise ValueError(f'Printed linker {program!r} does not match the selected action linker {selected_program!r}')
            return actual

        def is_linux_link_input(value):
            return re.search(r'\.(?:o|a|rlib|so(?:\.[0-9]+)*)$', value) is not None

        def printed_linker_inputs(argv):
            # Parse explicit file arguments and preserve unresolved library/response requests separately.
            inputs = []
            requests = []
            rejected = []
            output_operands = {'-o', '--output', '-L', '--library-path', '--sysroot', '-isysroot',
                               '-target', '--target', '-fuse-ld', '-Map', '--Map', '--why-extract'}
            operands = []
            for argument in argv[1:]:
                operands.extend(argument[len('-Wl,'):].split(',') if argument.startswith('-Wl,') else [argument])
            index = 0
            while index < len(operands):
                argument = operands[index]
                if argument in output_operands:
                    if index + 1 >= len(operands):
                        rejected.append({'argument': argument, 'reason': 'missing option operand'})
                    index += 2
                    continue
                if argument in ('-l', '--library'):
                    if index + 1 >= len(operands):
                        rejected.append({'argument': argument, 'reason': 'missing library operand'})
                    else:
                        requests.append({'kind': 'library-search-request', 'argument': argument,
                                         'name': operands[index + 1]})
                    index += 2
                    continue
                if argument.startswith('-l') and len(argument) > 2:
                    requests.append({'kind': 'library-search-request', 'argument': argument, 'name': argument[2:]})
                elif argument.startswith('--library='):
                    requests.append({'kind': 'library-search-request', 'argument': argument,
                                     'name': argument.split('=', 1)[1]})
                elif argument.startswith('@'):
                    rejected.append({'argument': argument, 'reason': 'unexpanded linker response file'})
                elif is_linux_link_input(argument):
                    if argument.startswith('-'):
                        rejected.append({'argument': argument, 'reason': 'unsupported input-bearing option'})
                    else:
                        inputs.append(argument)
                index += 1
            return {'inputs': inputs, 'library_requests': requests, 'rejected': rejected}

        def linker_stdout_records(text):
            records = []
            active = False
            for number, raw_line in enumerate(text.splitlines(), 1):
                line = re.sub(r'\x1b\[[0-9;]*m', '', raw_line)
                prefix = 'warning: linker stdout: '
                if line.startswith(prefix):
                    active = True
                    records.append({'line_number': number, 'raw_line': raw_line, 'payload': line[len(prefix):]})
                elif active and line.startswith('         '):
                    records.append({'line_number': number, 'raw_line': raw_line, 'payload': line[9:]})
                else:
                    active = False
            return records

        def parse_linker_trace_input(payload):
            value = payload.strip()
            if value.startswith('"') and value.endswith('"'):
                tokens = shlex.split(value, posix=True)
                if len(tokens) != 1:
                    raise ValueError('A linker trace record contains multiple quoted arguments')
                value = tokens[0]
            if not value:
                return None
            match = re.fullmatch(r'(.+\.(?:a|rlib))\((.+)\)', value)
            if match:
                return {'path': match.group(1), 'member': match.group(2)}
            if is_linux_link_input(value):
                if re.match(r'^[A-Za-z_][A-Za-z0-9_]*=', value) or '" "' in value or value.startswith('-'):
                    raise ValueError('A linker command or option was supplied as one trace path')
                return {'path': value, 'member': None}
            raise ValueError('Unrecognized nonempty linker stdout record')

        def missing_rust_object_kind(path, member, output_directory, crate_name, compiler_matches):
            # Narrow source-backed exceptions for disposable objects emitted by this exact Rustc action.
            # Rust 1.95 link.rs creates symbols.o below output/rustc*/ and adds local crate objects.
            # Rust 1.95 config.rs names codegen objects with the .rcgu.o suffix in the output directory.
            if not compiler_matches or member is not None:
                return None
            if (path.name == 'symbols.o' and path.parent.parent == output_directory
                    and re.fullmatch(r'rustc[A-Za-z0-9._-]+', path.parent.name)):
                return 'rustc-generated-symbol-retention-object'
            if (path.parent == output_directory and path.name.startswith(crate_name + '.')
                    and path.name.endswith('.rcgu.o')):
                return 'current-cli-crate-codegen-object'
            return None

        bazel = shutil.which('bazelisk')
        if not bazel:
            raise SystemExit('Maintained Bazelisk was not installed')
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-bazel'
        startup = [bazel, '--output_user_root=' + str(root)]
        if windows:
            startup.append('--windows_enable_symlinks')
        options = ['--config=' + os.environ['RELEASE_CONFIG']]
        if windows:
            options += ['--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0',
                        '--extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all']
        flag = '--@rules_rust//rust/settings:experimental_per_crate_rustc_flag=crates/rustleaks-cli/src/main.rs@'
        options += [flag + '--print=link-args', flag + '-Wlinker-messages']
        if windows:
            options += [flag + '-Clink-arg=/VERBOSE:LIB', flag + '-Clink-arg=/MAP:' + str(out / 'link.map')]
        else:
            options += [flag + '-Clink-arg=-Wl,--trace',
                        flag + '-Clink-arg=-Wl,-Map=' + str(out / 'link.map'),
                        flag + '-Clink-arg=-Wl,--why-extract=' + str(out / 'why-extract.tsv'),
                        '--sandbox_writable_path=' + str(out)]
        write_json('bazel-invocation.json', {'startup': startup, 'options': options,
                                          'target': '//crates/rustleaks-cli:rustleaks'})
        run('rustup-version', ['rustup', 'show', 'active-toolchain'])
        run('installed-rustc-version', ['rustc', '-vV'])
        run('cargo-version', ['cargo', '-vV'])
        run('bazelisk-version', [bazel, 'bazeliskVersion'])
        run('bazel-version', startup + ['version'])
        run('build', startup + ['build'] + options + ['--materialize_param_files',
            '//crates/rustleaks-cli:rustleaks'], timeout=2700)
        # These collect the same configured action after a failed build too; no retry occurs.
        query = run('rustc-aquery', startup + ['aquery'] + options + ['--output=jsonproto',
            '--include_param_files', 'mnemonic("Rustc", //crates/rustleaks-cli:rustleaks)'], timeout=300)
        (out / 'rustc-aquery.json').write_text(query, encoding='utf-8')
        info = {}
        for key in ('execution_root', 'bazel-bin', 'output_base'):
            info[key] = run('info-' + key, startup + ['info'] + options + [key], timeout=120).strip()
        write_json('bazel-paths.json', info)
        try:
            graph = json.loads(query)
            execution_root = pathlib.Path(info['execution_root'])
            fragments = {str(item['id']): item for item in graph.get('pathFragments', [])}
            def fragment_path(identifier):
                item = fragments[str(identifier)]
                parent = item.get('parentId')
                return (fragment_path(parent) / item['label']) if parent else pathlib.Path(item['label'])
            artifacts = {str(item['id']): fragment_path(item['pathFragmentId']) for item in graph.get('artifacts', [])}
            targets = {str(item['id']): item['label'] for item in graph.get('targets', [])}
            actions = [item for item in graph.get('actions', []) if item.get('mnemonic') == 'Rustc'
                       and targets.get(str(item.get('targetId'))) == '//crates/rustleaks-cli:rustleaks']
            write_json('binary-rustc-actions.json', actions)
            if len(actions) != 1:
                raise ValueError(f'Expected exactly one binary Rustc action, got {len(actions)}')
            action = actions[0]
            arguments = list(action.get('arguments', []))
            parameter_records = []
            for index, parameter in enumerate(action.get('paramFiles', [])):
                arguments += parameter.get('arguments', [])
                path = execution_root / parameter['execPath']
                record = {'exec_path': parameter['execPath'], 'arguments': parameter.get('arguments', [])}
                if path.is_file():
                    destination = out / 'parameter-files' / f'{index:03d}.params'
                    destination.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copyfile(path, destination)
                    record.update(file_identity(path), retained_path=str(destination.relative_to(out)))
                else:
                    record['materialized_file_missing'] = True
                    errors.append('Materialized parameter file is missing: ' + str(path))
                parameter_records.append(record)
            write_json('parameter-files.json', parameter_records)
            def resolution_candidates(value):
                candidate = pathlib.Path(value.strip('"'))
                candidate = candidate if candidate.is_absolute() else execution_root / candidate
                candidates = [candidate]
                if '/execroot/' in str(candidate):
                    suffix = str(candidate).split('/execroot/', 1)[1].split('/', 1)
                    if len(suffix) == 2:
                        recovered = execution_root / suffix[1]
                        if recovered != candidate:
                            candidates.append(recovered)
                return candidates
            def resolve(value):
                candidates = resolution_candidates(value)
                return next((path for path in candidates if path.exists()), candidates[-1])
            rustc_values = [item for item in arguments if pathlib.Path(item).name.lower() in ('rustc', 'rustc.exe')]
            codegen = normalize_codegen(arguments)
            write_json('normalized-codegen-options.json', codegen)
            if len(set(rustc_values)) != 1:
                raise ValueError('Actual compiler path is missing or ambiguous in the Rustc action')
            rustc = resolve(rustc_values[0])
            linker = resolve(selected_linker(codegen))
            write_json('actual-tools.json', {'rustc': file_identity(rustc), 'linker': file_identity(linker)})
            rust_version = run('actual-rustc-version', [rustc, '-vV'], cwd=execution_root)
            compiler_matches = 'commit-hash: 59807616e1fa2540724bfbac14d7976d7e4a3860' in rust_version
            if not compiler_matches:
                errors.append('Actual Rust compiler does not report the expected pinned 1.95.0 commit')
            if windows:
                write_json('actual-linker-version.json', windows_file_version(linker))
            else:
                run('actual-linker-version', [linker, '--version'], cwd=execution_root)
            sysroot = run('actual-rustc-sysroot', [rustc, '--print=sysroot'], cwd=execution_root).strip()
            if not sysroot:
                raise ValueError('The actual compiler reported an empty sysroot')
            rust_docs = resolve(sysroot) / 'share/doc/rust'
            required_rust_notices = (
                'COPYRIGHT-library.html', 'licenses/Apache-2.0.txt', 'licenses/MIT.txt',
                'licenses/Unicode-3.0.txt', 'licenses/BSD-2-Clause.txt',
            )
            for name in required_rust_notices:
                notice(rust_docs / name, 'required Rust distribution notice/supporting text', required=True)
            # Retain all remaining supporting texts supplied by this exact distribution too.
            if (rust_docs / 'licenses').is_dir():
                for path in sorted((rust_docs / 'licenses').glob('*.txt')):
                    if path.relative_to(rust_docs).as_posix() not in required_rust_notices:
                        notice(path, 'additional Rust distribution supporting license text')
            binary = pathlib.Path(info['bazel-bin']) / 'crates/rustleaks-cli' / ('rustleaks.exe' if windows else 'rustleaks')
            if binary.is_file():
                write_json('binary.json', file_identity(binary))
            else:
                errors.append('Built binary is missing')
            if not (out / 'link.map').is_file():
                errors.append('Linker map is missing')
            build_text = ''.join((commands / ('build.' + stream + '.log')).read_text(encoding='utf-8', errors='replace')
                                 for stream in ('stdout', 'stderr') if (commands / ('build.' + stream + '.log')).exists())
            if windows:
                dumpbin = linker.parent / 'dumpbin.exe'
                librarian = linker.parent / 'lib.exe'
                if not dumpbin.is_file() or not librarian.is_file():
                    raise ValueError('Selected linker siblings dumpbin.exe/lib.exe are missing')
                write_json('inspection-tools.json', {'dumpbin': file_identity(dumpbin), 'lib': file_identity(librarian)})
                if binary.is_file():
                    run('binary-imports', [dumpbin, '/IMPORTS', binary])
                    run('binary-headers', [dumpbin, '/HEADERS', binary])
                vswhere = pathlib.Path(os.environ['ProgramFiles(x86)']) / 'Microsoft Visual Studio/Installer/vswhere.exe'
                write_json('vswhere-tool.json', file_identity(vswhere))
                run('vs-installation-paths', [vswhere, '-all', '-products', '*', '-property', 'installationPath'])
                run('vs-installation-versions', [vswhere, '-all', '-products', '*', '-property', 'installationVersion'])
                ancestors = [linker] + list(linker.parents)
                toolsets = [path for path in ancestors if path.parent.name.lower() == 'msvc']
                if len(toolsets) != 1:
                    raise ValueError('Cannot identify selected MSVC toolset from actual link.exe path')
                toolset = toolsets[0]
                vs_root = toolset.parent.parent.parent.parent
                write_json('selected-visual-studio.json', {'installation_path': str(vs_root), 'toolset_path': str(toolset),
                                                         'toolset_version': toolset.name})
                library_dirs = []
                for variable in action.get('environmentVariables', []):
                    if variable['key'].upper() == 'LIB':
                        library_dirs += [pathlib.Path(value) for value in variable['value'].split(';') if value]
                for item in arguments:
                    if item.startswith('-Lnative='):
                        library_dirs.append(resolve(item.split('=', 1)[1]))
                for key, value in codegen:
                    if key == 'link-arg':
                        match = re.match(r'(?i)^/LIBPATH:(.+)$', value)
                        if match:
                            library_dirs.append(resolve(match.group(1)))
                trace = parse_msvc_trace((commands / 'build.stderr.log').read_text(encoding='utf-8', errors='replace'))
                write_json('windows-linker-trace.json', trace)
                if not trace:
                    errors.append('No MSVC linker stdout trace was recovered')
                searched = {}
                loaded = []
                current = None
                for record in trace:
                    if record['kind'] == 'search':
                        current = resolve(record['library'])
                        record['attempted_path'] = str(current)
                        try:
                            record['canonical_path'] = str(current.resolve(strict=True))
                            searched.setdefault(record['library_id'], set()).add(record['canonical_path'])
                        except OSError as error:
                            record['resolution_error'] = repr(error)
                            errors.append('Unresolved observed MSVC search path: ' + record['library'])
                    elif record['kind'] == 'loaded':
                        candidates = set()
                        direct = pathlib.Path(record['library'])
                        if direct.is_absolute() and direct.is_file():
                            candidates.add(str(direct.resolve()))
                        elif current is not None and msvc_library_id(str(current)) == record['library_id'] and current.is_file():
                            candidates.add(str(current.resolve()))
                        else:
                            candidates.update(searched.get(record['library_id'], set()))
                        record['candidate_paths'] = sorted(candidates)
                        loaded.append(record)
                    elif record['kind'] == 'unrecognized':
                        errors.append('Unrecognized MSVC trace record at line ' + str(record['line_number']))
                write_json('windows-linker-trace.json', trace)
                write_json('windows-loaded-members.json', loaded)
                write_json('windows-searched-libraries.json', {name: sorted(paths) for name, paths in searched.items()})
                map_members = parse_msvc_map((out / 'link.map').read_text(encoding='utf-8', errors='replace'))
                selected = set()
                native_members = []
                for member in map_members:
                    corroborating = [item for item in loaded if item['library_id'] == member['library_id']
                                     and item['member_name'] == member['member_name']]
                    candidates = {path for item in corroborating for path in item['candidate_paths']}
                    if not candidates:
                        candidates = set(searched.get(member['library_id'], set()))
                    member['candidate_paths'] = sorted(candidates)
                    member['association'] = 'map-and-loaded-trace' if corroborating else 'map-and-observed-search-path'
                    if len(candidates) != 1:
                        member['status'] = 'unresolved'
                        errors.append('Missing or ambiguous provider for map member: ' + member['library'] + ':' + member['member'])
                        continue
                    path = pathlib.Path(next(iter(candidates)))
                    member['status'] = 'resolved'
                    if path.suffix.lower() == '.lib':
                        selected.add(str(path))
                        native_members.append(member)
                    else:
                        member['provider_kind'] = 'Rust archive identified by observed search path'
                write_json('windows-map-members.json', map_members)
                write_json('windows-native-members.json', native_members)
                if not any(item['library_id'] == 'msvcrt' and item['member_kind'] == 'object' for item in native_members):
                    errors.append('No resolved MSVC static startup/support object was recovered')
                selected = sorted(selected)
                write_json('selected-libraries.json', [file_identity(path) for path in selected])
                if len(selected) > 60:
                    raise ValueError('Selected native library count exceeds the bounded 60-library diagnostic')
                for index, path in enumerate(selected):
                    run(f'libraries/{index:03d}-members', [librarian, '/NOLOGO', '/LIST', path], timeout=60)
                    run(f'libraries/{index:03d}-linkermembers', [dumpbin, '/LINKERMEMBER:1', path], timeout=60)
                    if re.search(r'(?i)(msvcrt|vcruntime|ucrt|libcmt|oldnames|legacy_stdio|msvcprt|libcpmt)', pathlib.Path(path).name):
                        run(f'libraries/{index:03d}-directives', [dumpbin, '/DIRECTIVES', path], timeout=60)
                sdk_pairs = set()
                for path in [str(item) for item in library_dirs] + selected:
                    match = re.search(r'(?i)(.+[\\/]Windows Kits[\\/]10)[\\/]Lib[\\/]([^\\/]+)', path)
                    if match:
                        sdk_pairs.add((match.group(1), match.group(2)))
                write_json('selected-windows-sdks.json', [{'root': root, 'version': version} for root, version in sorted(sdk_pairs)])
                if not sdk_pairs:
                    errors.append('No exact selected Windows SDK version was recovered')
                # Inspect only selected-installation public terms/notice locations and filenames.
                roots = [(vs_root / 'Licenses', 5), (toolset / 'crt', 7), (toolset, 1)]
                redist_root = vs_root / 'VC/Redist/MSVC'
                if redist_root.is_dir():
                    redist_versions = sorted(path for path in redist_root.iterdir() if path.is_dir()
                                             and path.name.split('.')[:2] == toolset.name.split('.')[:2])
                    roots += [(path, 5) for path in redist_versions]
                    write_json('matching-vc-redist-directories.json', [str(path) for path in redist_versions])
                for root_value, version in sorted(sdk_pairs):
                    sdk = pathlib.Path(root_value)
                    roots += [(sdk / 'Licenses' / version, 5), (sdk / 'Licenses', 0),
                              (sdk / 'Redist' / version, 4), (sdk, 0)]
                public_name = re.compile(r'(?i)(licen[cs]e|eula|redist|third.?party.?notices|notice|copyright)')
                public_suffixes = {'.txt', '.rtf', '.html', '.htm', '.md', '.docx', '.pdf'}
                searched_notices = []
                for root_path, depth_limit in roots:
                    searched_notices.append({'root': str(root_path), 'exists': root_path.is_dir(), 'maximum_depth': depth_limit})
                    if not root_path.is_dir():
                        continue
                    for directory, subdirs, files in os.walk(root_path, followlinks=False):
                        depth = len(pathlib.Path(directory).relative_to(root_path).parts)
                        if depth >= depth_limit:
                            subdirs.clear()
                        for name in sorted(files):
                            path = pathlib.Path(directory) / name
                            if public_name.search(name) and path.suffix.lower() in public_suffixes:
                                notice(path, 'selected Windows installation public terms/notice candidate')
                write_json('windows-notice-search.json', searched_notices)
                if not any('Windows installation' in item['origin'] for item in notices):
                    errors.append('No public Windows terms/notice file was found in the bounded selected locations')
                # Retain source identities and exact legal-comment bytes, never implementation source.
                startup_sources = []
                source_root = toolset / 'crt/src'
                object_members = [item for item in native_members if item['member_kind'] == 'object']
                by_stem = {}
                for member in object_members:
                    stem = pathlib.PureWindowsPath(member['member']).stem.lower()
                    by_stem.setdefault(stem, []).append(member['library'] + ':' + member['member'])
                matched_stems = set()
                if source_root.is_dir():
                    for directory, _, files in os.walk(source_root, followlinks=False):
                        for name in files:
                            path = pathlib.Path(directory) / name
                            stem = path.stem.lower()
                            if stem not in by_stem or path.suffix.lower() not in ('.c', '.cpp', '.asm'):
                                continue
                            matched_stems.add(stem)
                            metadata = file_identity(path)
                            metadata['candidate_archive_members'] = by_stem[stem]
                            metadata['association_basis'] = 'object basename only; source variant and architecture require review'
                            metadata['legal_comment_ranges'] = []
                            raw = path.read_bytes()
                            for index, (start, end) in enumerate(legal_comment_ranges(raw)):
                                block = raw[start:end]
                                destination = out / 'startup-comment-notices' / (metadata['sha256'][:16] + f'-{index:02d}.notice')
                                destination.parent.mkdir(parents=True, exist_ok=True)
                                destination.write_bytes(block)
                                metadata['legal_comment_ranges'].append({'source_byte_start': start,
                                    'source_byte_end_exclusive': end, 'sha256': hashlib.sha256(block).hexdigest(),
                                    'retained_path': str(destination.relative_to(out))})
                            startup_sources.append(metadata)
                write_json('startup-source-metadata.json', startup_sources)
                write_json('startup-source-search.json', {'source_root': str(source_root),
                    'requested_member_stems': by_stem, 'unmatched_member_stems': sorted(set(by_stem) - matched_stems)})
            else:
                lld = linker.parent / 'ld.lld'
                if not lld.is_file():
                    raise ValueError('The selected Clang driver has no adjacent ld.lld')
                write_json('actual-lld.json', file_identity(lld))
                run('actual-lld-version', [lld, '--version'], cwd=execution_root)
                readelf = shutil.which('readelf')
                if not readelf:
                    raise ValueError('Preinstalled readelf is unavailable')
                run('readelf-version', [readelf, '--version'])
                if binary.is_file():
                    run('binary-elf', [readelf, '--file-header', '--program-headers', '--dynamic', '--symbols', binary])
                archive_candidates = [linker.parent / 'llvm-ar', pathlib.Path(shutil.which('ar') or '/nonexistent')]
                archive_tool = next((path for path in archive_candidates if path.is_file()), None)
                if archive_tool is None:
                    raise ValueError('An existing archive-member inspection tool is unavailable')
                write_json('inspection-tools.json', {'readelf': file_identity(readelf), 'archive_tool': file_identity(archive_tool)})
                run('archive-tool-version', [archive_tool, '--version'])
                selected = {}
                observations = []
                crate_names = [item.split('=', 1)[1] for item in arguments if item.startswith('--crate-name=')]
                crate_names += [arguments[index + 1] for index, item in enumerate(arguments[:-1]) if item == '--crate-name']
                if len(set(crate_names)) != 1 or crate_names[0] != 'rustleaks':
                    raise ValueError('The selected binary action is not the expected rustleaks crate')
                output_directory = binary.parent.resolve()
                def observed(value, kind, member=None):
                    value = value.strip()
                    if not is_linux_link_input(value):
                        return
                    record = {'kind': kind, 'path': value, 'member': member, 'attempted_paths': []}
                    try:
                        candidates = resolution_candidates(value)
                        record['attempted_paths'] = [str(candidate) for candidate in candidates]
                        path = resolve(value)
                        if path.is_file():
                            canonical = str(path.resolve())
                            selected[canonical] = path
                            record.update(status='resolved', canonical_path=canonical)
                        else:
                            classification = missing_rust_object_kind(
                                path.resolve(), member, output_directory, crate_names[0], compiler_matches)
                            if classification:
                                record.update(status='known-rustc-transient', classification=classification,
                                              canonical_path=None, provider_hash_unavailable=True,
                                              provenance='Rust commit 59807616e1fa2540724bfbac14d7976d7e4a3860; link.rs and config.rs')
                            else:
                                record.update(status='unresolved', canonical_path=None)
                                errors.append(f'Unresolved Linux runtime/link input: {value}; member={member!r}')
                    except (OSError, ValueError) as error:
                        record.update(status='unresolved', canonical_path=None, resolution_error=repr(error))
                        errors.append(f'Cannot resolve Linux runtime/link input: {value}; {error!r}')
                    observations.append(record)
                    write_json('linux-runtime-observations.json', observations)
                # Rustc --print=link-args writes complete shell-quoted commands to build stdout.
                # Parse these as data before looking at individual file arguments; never execute them.
                printed_commands = []
                printed_stdout = (commands / 'build.stdout.log').read_text(encoding='utf-8', errors='replace')
                for number, raw_line in enumerate(printed_stdout.splitlines(), 1):
                    if not raw_line.strip():
                        continue
                    record = {'stream': 'build.stdout', 'line_number': number, 'raw_line': raw_line}
                    try:
                        record.update(parse_printed_linker_command(raw_line))
                        validate_printed_linker_program(record['argv'][0], linker, execution_root)
                        actual_program = resolve(record['argv'][0])
                        if actual_program.resolve(strict=True) != linker.resolve(strict=True) or actual_program.name != linker.name:
                            raise ValueError('Printed linker canonical identity differs from the selected action linker')
                        record['status'] = 'validated'
                        parsed = printed_linker_inputs(record['argv'])
                        record.update(parsed)
                        for rejection in parsed['rejected']:
                            errors.append('Printed linker input: ' + repr(rejection))
                        for value in parsed['inputs']:
                            observed(value, 'printed-linker-argument')
                    except (OSError, ValueError) as error:
                        record.update(status='unresolved-command', error=repr(error))
                        errors.append(f'Printed linker command at stdout line {number}: {error!r}')
                    printed_commands.append(record)
                    write_json('printed-linker-commands.json', printed_commands)
                if sum(record['status'] == 'validated' for record in printed_commands) != 1:
                    errors.append('Expected exactly one validated printed linker command for the CLI binary')
                why = out / 'why-extract.tsv'
                if not why.is_file():
                    errors.append('LLD why-extract output is missing')
                else:
                    with why.open(encoding='utf-8', errors='replace') as stream:
                        for row in csv.reader(stream, delimiter='\t'):
                            for value in row[:2]:
                                match = re.match(r'(.+\.(?:a|rlib))\((.+)\)$', value)
                                if match:
                                    observed(match.group(1), 'why-extract', match.group(2))
                                else:
                                    observed(value, 'why-extract')
                trace_records = linker_stdout_records((commands / 'build.stderr.log').read_text(encoding='utf-8', errors='replace'))
                if not trace_records:
                    errors.append('No linker stdout trace block was recovered from Rustc diagnostics')
                for record in trace_records:
                    try:
                        parsed = parse_linker_trace_input(record['payload'])
                        if parsed is not None:
                            record.update(status='parsed', **parsed)
                            observed(parsed['path'], 'linker-trace', parsed['member'])
                        else:
                            record['status'] = 'empty'
                    except ValueError as error:
                        record.update(status='unresolved-trace', error=repr(error))
                        errors.append(f'Unrecognized linker trace at stderr line {record["line_number"]}: {error!r}')
                write_json('linker-trace-records.json', trace_records)
                write_json('linux-runtime-observations.json', observations)
                write_json('selected-libraries.json', [file_identity(path) for _, path in sorted(selected.items())])
                if not any(path.name == 'libc.a' and 'self-contained' in str(path) for path in selected.values()):
                    errors.append('Trace did not identify the actual Rust self-contained libc.a')
                if not any(path.suffix == '.o' and path.name.startswith(('crt', 'Scrt', 'rcrt')) for path in selected.values()):
                    errors.append('Trace did not identify a selected CRT object')
                if not any('unwind' in path.name for path in selected.values()):
                    errors.append('Trace did not identify the selected unwind archive')
                if len(selected) > 150:
                    raise ValueError('Runtime input count exceeds the bounded 150-input diagnostic')
                for index, (_, path) in enumerate(sorted(selected.items())):
                    if path.suffix in ('.a', '.rlib'):
                        run(f'libraries/{index:03d}-members', [archive_tool, 't', path], timeout=60)
                external = execution_root / 'external'
                if external.is_dir():
                    for repository in sorted(external.iterdir()):
                        if 'llvm' not in repository.name:
                            continue
                        for name in ('compiler-rt/LICENSE.TXT', 'libunwind/LICENSE.TXT',
                                     'libcxx/LICENSE.TXT', 'libcxxabi/LICENSE.TXT'):
                            notice(repository / name, 'hydrated LLVM source notice; provider association requires trace review')
        except Exception as error:
            errors.append('Evidence collection: ' + repr(error))
            print(json.dumps({'collection_error': errors[-1]}, ensure_ascii=True), file=sys.stderr, flush=True)
        finally:
            write_json('collection-result.json', {'errors': errors, 'command_count': len(records),
                       'meaning': 'Evidence completeness only; no release qualification or licensing conclusion'})
        if errors:
            raise SystemExit(1)
    - name: Retain final source state and all prior step outcomes
      id: finalize
      if: "${{ always() }}"
      timeout-minutes: 5
      env:
        PRIOR_STEP_OUTCOMES: "${{ toJson(steps) }}"
      run: |
        import hashlib
        import json
        import os
        import pathlib
        import subprocess

        out = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['DIAGNOSTIC_EVIDENCE_SUBDIR']
        out.mkdir(parents=True, exist_ok=True)
        (out / 'step-outcomes.json').write_text(os.environ['PRIOR_STEP_OUTCOMES'] + '\n')
        source = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'rustleaks'
        errors = []
        if (source / '.git').is_dir():
            for name, arguments in (('source-after', ['status', '--porcelain=v1', '--untracked-files=all']),
                                    ('source-head-after', ['rev-parse', 'HEAD']),
                                    ('source-diff-after', ['diff', '--binary'])):
                result = subprocess.run(['git', '-C', str(source), *arguments], capture_output=True, check=False)
                (out / (name + '.stdout')).write_bytes(result.stdout)
                (out / (name + '.stderr')).write_bytes(result.stderr)
                (out / (name + '.exit-status')).write_text(str(result.returncode) + '\n')
                if result.returncode:
                    errors.append(name + ' failed')
                if name == 'source-after' and result.stdout.strip():
                    errors.append('Source checkout changed')
                if name == 'source-head-after' and result.stdout.decode().strip() != os.environ['DIAGNOSTIC_SOURCE_SHA']:
                    errors.append('Source commit changed')
        else:
            errors.append('Source checkout is missing')
        (out / 'finalization.json').write_text(json.dumps({'errors': errors}, indent=2) + '\n')
        inventory = []
        for path in sorted(out.rglob('*')):
            if path.is_file() and path.name != 'evidence-inventory.json':
                inventory.append({'path': str(path.relative_to(out)), 'size': path.stat().st_size,
                                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
        (out / 'evidence-inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
        if errors:
            raise SystemExit(1)
    - name: Upload all available runtime evidence
      id: upload
      if: "${{ always() }}"
      timeout-minutes: 5
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-inputs-${{ matrix.target }}-c74f50f-${{ github.run_id }}-${{
          github.run_attempt }}
        path: "${{ runner.temp }}/runtime-input-evidence/"
        if-no-files-found: error
        include-hidden-files: true
    - name: Record upload and final step outcomes
      if: "${{ always() }}"
      timeout-minutes: 1
      env:
        ALL_PRIOR_STEP_OUTCOMES: "${{ toJson(steps) }}"
      run: |
        import os
        import pathlib
        text = os.environ['ALL_PRIOR_STEP_OUTCOMES']
        print(text)
        with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
            stream.write('Runtime diagnostic step outcomes, including upload:\n\n```json\n' + text + '\n```\n')
