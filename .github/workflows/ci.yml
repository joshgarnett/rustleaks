name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "29 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  bazel-acceptance:
    name: Bazel acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Run the authoritative acceptance gate
        working-directory: rustleaks
        run: just ci
      - name: Verify Cargo and Bazel dependency drift
        working-directory: rustleaks
        run: |
          cargo xtask build-system-check
          bazelisk query @crates//:srcs >/dev/null
          git diff --exit-code -- Cargo.lock cargo-bazel-lock.json MODULE.bazel.lock

  toolchains:
    name: Current stable and MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Install current stable and MSRV
        working-directory: rustleaks
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.85.0 --profile minimal
      - name: Check current stable feature profiles
        working-directory: rustleaks
        run: |
          cargo +stable check --workspace --all-targets --locked
          cargo +stable check --workspace --all-targets --all-features --locked
          cargo +stable check --workspace --all-targets --no-default-features --locked
      - name: Check the declared MSRV
        working-directory: rustleaks
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  security:
    name: Security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Install pinned security tools
        working-directory: rustleaks
        run: |
          cargo install cargo-deny --locked --version 0.19.9
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-vet --locked --version 0.10.2
          cargo install cargo-geiger --locked --version 0.13.0
          rustup toolchain install nightly-2026-08-21 --profile minimal --component miri
          cargo +nightly-2026-08-21 miri setup
      - name: Run dependency and owned-code security policy
        working-directory: rustleaks
        run: just security

  fuzz:
    name: Fuzz build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-bazelisk: "false"
      - name: Install pinned fuzz tools
        working-directory: rustleaks
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal --component llvm-tools-preview
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Hydrate locked fuzz dependencies
        working-directory: rustleaks
        run: |
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-core/fuzz/Cargo.toml
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-sources/fuzz/Cargo.toml
          cargo +nightly-2026-08-21 fetch --locked --manifest-path crates/rustleaks-report/fuzz/Cargo.toml
      - name: Build targets and replay bounded smoke campaigns
        working-directory: rustleaks
        run: just fuzz-smoke

  package:
    name: Package and non-publishing dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Hydrate locked package dependencies
        working-directory: rustleaks
        run: cargo fetch --locked
      - name: Run package consumers and no-upload publish simulation
        working-directory: rustleaks
        run: just release-dry-run

  parity:
    name: Pinned oracle and committed parity
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Check out the pinned Go oracle
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: gitleaks/gitleaks
          ref: b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b
          path: gitleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: gitleaks/go.sum
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
      - name: Verify the oracle and committed compatibility evidence
        working-directory: rustleaks
        run: |
          cargo xtask verify-upstream
          cargo xtask oracle generate --check --skip-git
          just parity

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  native-linux:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            config: linux-x86_64-gnu
            host_platform: //platforms:linux_x86_64_gnu
            execution_platform: //platforms:linux_x86_64_gnu
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
            config: linux-aarch64-gnu
            host_platform: //platforms:linux_aarch64_gnu
            execution_platform: //platforms:linux_aarch64_gnu
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-musl
            config: linux-x86_64-musl
            host_platform: //platforms:linux_x86_64_gnu
            execution_platform: //platforms:linux_x86_64_musl
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-musl
            config: linux-aarch64-musl
            host_platform: //platforms:linux_aarch64_gnu
            execution_platform: //platforms:linux_aarch64_musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Verify native host architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
      - name: Build and test the native target
        working-directory: rustleaks
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
          EXECUTION_PLATFORM: ${{ matrix.execution_platform }}
          HOST_PLATFORM: ${{ matrix.host_platform }}
        run: |
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" //:build
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" --extra_execution_platforms="${EXECUTION_PLATFORM}" --build_tests_only //:test
          bazelisk test --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" --extra_execution_platforms="${EXECUTION_PLATFORM}" --jobs=1 //:test

  native-macos:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
            config: macos-x86_64
            host_platform: //platforms:macos_x86_64
            execution_platform: //platforms:macos_x86_64
            test_compilation_mode: opt
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
            config: macos-aarch64
            host_platform: //platforms:macos_aarch64
            execution_platform: //platforms:macos_aarch64
            test_compilation_mode: fastbuild
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Verify native host architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
      - name: Build and test the native target
        working-directory: rustleaks
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
          EXECUTION_PLATFORM: ${{ matrix.execution_platform }}
          HOST_PLATFORM: ${{ matrix.host_platform }}
          TEST_COMPILATION_MODE: ${{ matrix.test_compilation_mode }}
        run: |
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" //:build
          bazelisk build --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" --extra_execution_platforms="${EXECUTION_PLATFORM}" --compilation_mode="${TEST_COMPILATION_MODE}" --build_tests_only //:test
          bazelisk test --config="${BAZEL_CONFIG}" --host_platform="${HOST_PLATFORM}" --extra_execution_platforms="${EXECUTION_PLATFORM}" --compilation_mode="${TEST_COMPILATION_MODE}" --jobs=1 //:test

  native-windows:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: X64
            target: x86_64-pc-windows-msvc
            config: windows-x86_64-msvc
            host_platform: //platforms:windows_x86_64_msvc
            execution_platform: //platforms:windows_x86_64_msvc
          - runner: windows-11-arm
            architecture: Arm64
            target: aarch64-pc-windows-msvc
            config: windows-aarch64-msvc
            host_platform: //platforms:windows_aarch64_msvc
            execution_platform: //platforms:windows_aarch64_msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out Rustleaks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rustleaks
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Set up maintained tools
        uses: ./rustleaks/.github/actions/setup
        with:
          install-just: "false"
      - name: Verify native host architecture
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $env:EXPECTED_ARCHITECTURE) {
            throw "expected $env:EXPECTED_ARCHITECTURE runner, got $actual"
          }
      - name: Build and test the native target
        shell: pwsh
        working-directory: rustleaks
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
          EXECUTION_PLATFORM: ${{ matrix.execution_platform }}
          HOST_PLATFORM: ${{ matrix.host_platform }}
        run: |
          bazelisk --output_user_root=C:/b --windows_enable_symlinks build --config="$env:BAZEL_CONFIG" --host_platform="$env:HOST_PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all //:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk --output_user_root=C:/b --windows_enable_symlinks build --enable_runfiles --config="$env:BAZEL_CONFIG" --host_platform="$env:HOST_PLATFORM" --extra_execution_platforms="$env:EXECUTION_PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all --build_tests_only //:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk --output_user_root=C:/b --windows_enable_symlinks test --enable_runfiles --config="$env:BAZEL_CONFIG" --host_platform="$env:HOST_PLATFORM" --extra_execution_platforms="$env:EXECUTION_PLATFORM" --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0 --extra_toolchains=@@rules_cc++cc_configure_extension+local_config_cc_toolchains//:all --test_env=PATH --jobs=1 //:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    name: Required
    if: always()
    needs:
      - bazel-acceptance
      - toolchains
      - security
      - fuzz
      - package
      - parity
      - dependency-review
      - native-linux
      - native-macos
      - native-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI boundary
        env:
          BAZEL_ACCEPTANCE: ${{ needs.bazel-acceptance.result }}
          TOOLCHAINS: ${{ needs.toolchains.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          PACKAGE: ${{ needs.package.result }}
          PARITY: ${{ needs.parity.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          NATIVE_LINUX: ${{ needs.native-linux.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for result in \
            "${BAZEL_ACCEPTANCE}" \
            "${TOOLCHAINS}" \
            "${SECURITY}" \
            "${FUZZ}" \
            "${PACKAGE}" \
            "${PARITY}" \
            "${NATIVE_LINUX}" \
            "${NATIVE_MACOS}" \
            "${NATIVE_WINDOWS}"; do
            test "${result}" = success
          done
          if [[ "${EVENT_NAME}" = pull_request ]]; then
            test "${DEPENDENCY_REVIEW}" = success
          else
            test "${DEPENDENCY_REVIEW}" = skipped
          fi
