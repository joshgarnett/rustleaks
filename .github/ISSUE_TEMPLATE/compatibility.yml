name: Compatibility gap
description: Report a Gitleaks configuration, ignore file, baseline, report field or exit code that Rustleaks does not handle as documented, or a finding difference that loses a secret or is not listed in Differences from Gitleaks.
title: "compat: "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/user/gitleaks-differences.md first. Differences listed there are intended. Use this form when Rustleaks does not handle a Gitleaks configuration, ignore file, baseline, report field or exit code as documented, or when a finding difference loses a secret or is not listed there. A difference only in help, usage, error wording or log text is not a compatibility gap; use the defect or feature form. Do not include live credentials or private vulnerability details.
  - type: dropdown
    id: domain
    attributes:
      label: Compatibility domain
      options:
        - Configuration
        - Regular expressions
        - Detection or locations
        - Allowlists or ignores
        - Decoding or composite rules
        - Sessions or baselines
        - Files, archives, or Git
        - Reports or CLI
    validations:
      required: true
  - type: input
    id: rustleaks_revision
    attributes:
      label: Rustleaks revision
      description: Give the exact Rustleaks commit tested.
    validations:
      required: true
  - type: input
    id: upstream_revision
    attributes:
      label: Gitleaks revision
      description: Confirm the exact upstream revision used for comparison.
      value: b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Synthetic reproducer
      description: Provide the smallest configuration, byte input, source state, or command that demonstrates the difference.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Compared outcomes
      description: Record the redacted Gitleaks and Rustleaks functional outcomes that differ, such as findings, spans, locations, fingerprints, report fields, error class, or exit status.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and environment
      description: List the commands, target, feature set, and tool versions used.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I used only synthetic or reviewed public test data and redacted finding values.
          required: true
