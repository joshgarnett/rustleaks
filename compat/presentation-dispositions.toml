# Reviewed presentation changes for the frozen CLI corpus replay.
#
# The files in compat/cli-corpus are frozen historical evidence. The replay
# compares every Rust CLI observation with them exactly. Help text, parser
# usage text and diagnostic message wording are Rustleaks presentation, so a
# reviewed change to that text is recorded here instead of editing the corpus.
#
# Each [[presentation_disposition]] entry replaces one presentation field of
# one corpus variant with the exact text the Rust CLI must now print:
#
#   id             unique identifier, for example "PRES-CLI-0001"
#   variant        corpus variant, "<case id>/<variant id>"
#   field          "stdout" (help output only), "stderr_usage" or
#                  "stderr_event_message"
#   event          zero-based frozen stderr event index, only for
#                  "stderr_event_message"
#   frozen_sha256  SHA-256 of the frozen text being replaced
#   expected       exact new normalized text, spelled with "rustleaks"
#   reason         why the text changed
#
# A "stderr_usage" entry replaces the whole usage block, including the stderr
# events produced by its lines. Exit status, findings, reports, error class,
# severity, child cleanup and disclosure checks stay exact for every variant.
# An entry fails the check when the CLI output differs from its expected text,
# when the output it replaces still matches the frozen corpus, or when the
# replay does not use it.
#
# Each [[behavior_supersession]] entry records how a guarantee in the frozen
# compat/behavior-matrix.toml changed. The matrix itself stays unchanged.
#
#   behavior           behavior matrix ID
#   historical_status  status recorded in the behavior matrix
#   status             "superseded" or "narrowed"
#   statement          what is still guaranteed and what is not

schema_version = 1

[[behavior_supersession]]
behavior = "CLI-DEFER-001"
historical_status = "explicit-cli-polish-follow-up"
status = "superseded"
statement = "Help text and parser usage bytes are Rustleaks presentation and are not pinned to the frozen bytes. A change to them needs a reviewed presentation disposition with the exact new text. Command and flag acceptance stays a functional guarantee."

[[behavior_supersession]]
behavior = "CLI-009"
historical_status = "implemented-normalized-diagnostics"
status = "narrowed"
statement = "Stream routing, error class, severity and non-disclosure of inline configuration stay guaranteed. Diagnostic and error message wording is Rustleaks presentation and may change only through a reviewed presentation disposition with the exact new text."

[[presentation_disposition]]
id = "PRES-CLI-0001"
variant = "CLI-BB-001/root"
field = "stdout"
frozen_sha256 = "e10817928d97514364ad4d36eddf9c2f3ec08b453ab3858df8d328d468f7b043"
expected = '''
Rustleaks finds secrets in Git history, files, directories and standard
input. It also reads configuration, ignore and baseline files written for
Gitleaks.

Usage:
  rustleaks <command> [flags]

Commands:
  git         Scan the commits of a Git repository.
  dir         Scan a directory or a file. Other names: file, directory.
  stdin       Scan text from standard input.
  version     Print the Rustleaks version.
  help        Print help for Rustleaks or for one command.
  completion  Print a shell completion script.

Configuration flags:
  -c, --config <path>
          Read the configuration from this file.
          See "Configuration order" in 'rustleaks help'.
      --enable-rule <ids>
          Use only these rules. Separate rule IDs with commas.
          You can repeat this flag.

Suppression flags:
  -b, --baseline-path <path>
          Ignore findings that are already in this JSON report.
  -i, --rustleaks-ignore-path <path>
          Read ignore entries from this file or folder.
          In a folder, Rustleaks reads .rustleaksignore and
          the legacy .gitleaksignore. Default: ".", the current
          folder.
          Ignore files in the scanned folder are always read.
      --ignore-rustleaks-allow
          Do not skip lines that have an allow comment.
          Allow comments are rustleaks:allow and the legacy
          gitleaks:allow.

Report flags:
  -r, --report-path <path>
          Write a report to this file.
          Use "-" to write the report to standard output.
  -f, --report-format <format>
          Write the report in this format.
          Formats: json, csv, junit, sarif and template.
          Without this flag, the format comes from the file
          extension of --report-path: .json, .csv or .sarif.
      --report-template <path>
          Use this template file for the report.
          Also give --report-format template.
      --exit-code <number>
          Exit with this status when leaks are found.
          Default: 1.
      --redact[=<percent>]
          Hide secrets in logs, verbose output and reports.
          Without a value, hide the whole secret.
          --redact=20 hides 20 percent. Always use "=" here.
  -v, --verbose
          Print each finding to standard output.

Limit and decoding flags:
      --max-target-megabytes <number>
          Skip files that are larger than this many megabytes.
          0 means no limit. Default: 0.
      --max-decode-depth <number>
          Decode encoded text up to this many levels deep.
          0 turns decoding off. Default: 5.
      --base64-mode <mode>
          Choose how to find base64 text.
          Modes: compatible and extended. Default: compatible.
          compatible decodes padded standard base64 and unpadded
          URL-safe base64, and keeps only text output.
          extended also decodes padded URL-safe and unpadded
          standard base64, and keeps binary output.
      --max-archive-depth <number>
          Scan inside archives nested up to this many levels deep.
          0 means archives are not opened. Default: 0.
      --timeout <seconds>
          Stop the scan after this many seconds.
          0 means no time limit. Default: 0.
  -j, --jobs <number>
          Scan with this many detection threads.
          Default: the number of CPUs that Rustleaks may use, up to 12.
          This flag overrides workers in a --complete-profile file.
          Findings and reports do not depend on this number.
      --complete-profile <path>
          Scan with the limits in this profile file.
          Rustleaks then reports whether the scan was complete.
          The exit status is 2 when the scan was not complete.

Logging flags:
  -l, --log-level <level>
          Show log messages at this level and above.
          Levels: trace, debug, info, warn, error and fatal.
          Default: info.
      --no-banner
          Do not print the banner.

Other flags:
  -h, --help
          Print help.
      --version
          Print the Rustleaks version.

Legacy flag names:
  These older names also work.
      --gitleaks-ignore-path <path>
          Same as --rustleaks-ignore-path.
      --ignore-gitleaks-allow
          Same as --ignore-rustleaks-allow.
      --no-color
          Accepted and ignored. Rustleaks never prints color.

Configuration order:
  Rustleaks uses the first configuration that it finds:
    1. --config or -c
    2. RUSTLEAKS_CONFIG, the path of a configuration file
    3. RUSTLEAKS_CONFIG_TOML, the configuration text
    4. GITLEAKS_CONFIG, then GITLEAKS_CONFIG_TOML (legacy names)
    5. .rustleaks.toml in the scanned folder
    6. .gitleaks.toml in the scanned folder (legacy name)
  For stdin, the scanned folder is the current folder.
  If it finds none, Rustleaks uses its built-in default configuration.

Exit status:
  0    No leaks were found.
  1    Leaks were found, the scan stopped early, or an error occurred.
       Use --exit-code to change the status for leaks.
  2    The scan was not complete. Only with --complete-profile.
  126  An unknown long flag, such as --nope, was given.

Run 'rustleaks help <command>' for details.
'''
reason = "Rustleaks help lists every flag and command."

